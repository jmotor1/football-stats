/* ---------- rendering ---------- */
/* Every tap re-renders the screen. Keep the scroll position across renders
   (it used to snap back to the top on each digit), and when an entry panel
   opens or grows, scroll just enough to show the active field through the
   Save button. */
let lastRender = { screen: null, draft: null, gameStarted: false };
const screenScroll = {};
function render() {
  const before = document.querySelector("#app .scroll");
  const prevTop = before ? before.scrollTop : 0;
  const prev = lastRender;
  renderScreen();
  lastRender = { screen: game ? screen : "setup", draft, gameStarted: !!game };
  const sc = document.querySelector("#app .scroll");
  if (!sc) return;
  const sameScreen = prev.screen === lastRender.screen;
  if (!sameScreen && prev.screen) screenScroll[prev.screen] = prevTop;
  // back to the log or stats after an edit: land where you left off
  sc.scrollTop = sameScreen ? prevTop
    : (lastRender.screen === "log" || lastRender.screen === "stats") ? (screenScroll[lastRender.screen] || 0) : 0;
  if (lastRender.screen !== "live" && lastRender.screen !== "edit") return;
  if (!draft) { if (prev.draft && lastRender.screen === "live") sc.scrollTop = 0; return; }
  const panel = sc.querySelector(".panel:not(.hidden)");
  if (!panel) return;
  const newPanel = !sameScreen || prev.draft !== draft;
  const act = draft.active && sc.querySelector(`[data-focus="${draft.active}"]`);
  // a fresh panel shows its title when everything fits; otherwise the field being typed wins
  const actTop = act ? act.closest(".field") || act : null;
  const top = newPanel && (!actTop || fits(sc, panel, sc.querySelector("#saveBtn, #editSaveBtn") || panel)) ? panel : (actTop || panel);
  const bottom = sc.querySelector("#saveBtn, #editSaveBtn") || panel;
  keepInView(sc, top, bottom);
}
function fits(sc, topEl, bottomEl) {
  return bottomEl.getBoundingClientRect().bottom - topEl.getBoundingClientRect().top + 20 <= sc.clientHeight;
}
function keepInView(sc, topEl, bottomEl) {
  const cr = sc.getBoundingClientRect();
  const top = topEl.getBoundingClientRect().top - cr.top + sc.scrollTop - 10;
  const bottom = bottomEl.getBoundingClientRect().bottom - cr.top + sc.scrollTop + 10;
  let st = sc.scrollTop;
  if (bottom - st > sc.clientHeight) st = bottom - sc.clientHeight;   // bring Save up
  if (top < st) st = top;                                             // but never hide the field being typed
  sc.scrollTop = Math.max(0, st);
}
function renderScreen() {
  if (!game) { renderSetup(); return; }
  if (screen === "log") { renderLog(); return; }
  if (screen === "edit") { renderEdit(); return; }
  if (screen === "stats") { renderStats(); return; }
  const state = E.getState(game);
  const c = game.config;
  if (FootballStats.isFinal(game, state)) { draft = null; renderGameOver(state, c); return; }

  // Special phases take over: the correct panel auto-opens.
  if ((state.phase === "KICKOFF" || state.phase === "FREE_KICK") &&
      (!draft || draft.type !== "KICKOFF")) draft = newDraft("KICKOFF", state);
  if (state.phase === "TRY" && (!draft || draft.type !== "TRY")) draft = newDraft("TRY", state);
  if (state.phase === "PLAY" && draft &&
      (draft.type === "KICKOFF" || draft.type === "TRY")) draft = null;

  const inPlay = state.phase === "PLAY";
  const homeHas = state.possession === c.homeTeam.abbr;
  const awayHas = state.possession === c.awayTeam.abbr;
  const homeCol = readable(teamColor("home"), "#3ddc84");
  const awayCol = readable(teamColor("away"), "#5b9dff");

  app.innerHTML = `
    <div class="board">
      <div class="team">
        <span class="abbr-col"><span class="abbr" style="color:${homeCol}">${c.homeTeam.abbr}</span>${timeoutDots(c.homeTeam.abbr, state.quarter)}</span>
        <span class="pts" ${homeHas?`style="color:${homeCol}"`:''}>${state.score[c.homeTeam.abbr]}</span>
        ${homeHas?`<span class="poss-dot" style="background:${homeCol}"></span>`:''}
      </div>
      <div class="meta"><span>${quarterLabel(state.quarter)}</span><button class="menubtn" id="menuBtn" aria-label="Menu">⋯</button></div>
      <div class="team">
        ${awayHas?`<span class="poss-dot" style="background:${awayCol}"></span>`:''}
        <span class="pts" ${awayHas?`style="color:${awayCol}"`:''}>${state.score[c.awayTeam.abbr]}</span>
        <span class="abbr-col"><span class="abbr" style="color:${awayCol}">${c.awayTeam.abbr}</span>${timeoutDots(c.awayTeam.abbr, state.quarter)}</span>
      </div>
    </div>
    <div class="colorbars">
      <div class="cbar" style="background:${teamColor('home')};opacity:${homeHas?1:0.35}"></div>
      <div class="cbar" style="background:${teamColor('away')};opacity:${awayHas?1:0.35}"></div>
    </div>

    <div class="sit">
      ${renderSituation(state, c)}
    </div>

    <div class="scroll">
      ${renderTypes(state)}
      ${renderPanel(state, c)}
      ${soonMsg ? `<div style="margin-top:14px;text-align:center;color:var(--flag);font-size:13px;">${soonMsg}</div>` : ''}
    </div>

    ${renderLast(c)}
  `;
  wire();
}

function renderSituation(state, c) {
  if (state.phase === "PLAY") {
    const target = state.goalToGo ? "goal" : E.toGo(state);
    const ord = ["","1st","2nd","3rd","4th"][state.down];
    const fdAt = state.goalToGo ? "goal line" : E.displayYardLine(state.firstDownAt, state.possession, c);
    return `<div class="dd">${ord} & ${target}</div>
            <div class="spot">ball on <b>${E.displayYardLine(state.ballOn, state.possession, c)}</b> · first down at ${fdAt}</div>`;
  }
  if (state.phase === "TRY") {
    return `<div class="dd" style="font-size:24px;">Try — ${state.possession}</div>
            <div class="spot">after the touchdown · kick +1 or run/pass +2</div>`;
  }
  const label = state.phase === "FREE_KICK" ? "Free kick" : "Kickoff";
  return `<div class="dd" style="font-size:24px;">${label}</div>
          <div class="spot"><b>${state.possession}</b> kicking from the ${state.kickDefault}</div>`;
}

/* ---------- play log screen ---------- */
function buildDriveGroups() {
  const groups = [];
  let cur = null;
  for (const p of game.plays) {
    const cm = p.computed || {};
    if (p.type === "QUARTER_END") { groups.push({ kind:"qtr", play:p }); cur = null; continue; }
    if (p.type === "KICKOFF") { groups.push({ kind:"kick", play:p }); cur = null; continue; }
    if (p.type === "TRY") {
      const lastDrive = [...groups].reverse().find(g => g.kind === "drive");
      if (lastDrive) lastDrive.plays.push(Object.assign({ _sub:true }, { p }));
      else groups.push({ kind:"kick", play:p });
      continue;
    }
    const team = cm.possession;
    if (!cur || cur.team !== team) { cur = { kind:"drive", team, plays: [] }; groups.push(cur); }
    cur.plays.push({ p });
    const flipped = cm.possessionAfter !== team;
    const scored = (cm.events||[]).some(e => e==="TOUCHDOWN"||e==="FIELD_GOAL_GOOD"||e==="SAFETY");
    if (flipped || scored) cur = null;
  }
  return groups;
}
function driveStats(g) {
  let yards = 0, count = 0, endLabel = "in progress";
  for (const row of g.plays) {
    const p = row.p || row;
    if (!p || !p.computed) continue;
    const cm = p.computed;
    if (p.type !== "TIMEOUT" && p.type !== "TRY") count++;
    if (cm.possessionAfter === g.team) yards += (cm.ballOnAfter - cm.ballOnBefore);
    const ev = cm.events || [];
    if (ev.includes("TOUCHDOWN")) endLabel = "Touchdown";
    else if (ev.includes("FIELD_GOAL_GOOD")) endLabel = "Field goal";
    else if (ev.includes("SAFETY")) endLabel = "Safety";
    else if (ev.includes("TURNOVER_ON_DOWNS")) endLabel = "Turnover on downs";
    else if (p.type === "PUNT") endLabel = "Punt";
    else if (p.type === "TURNOVER") endLabel = p.input.turnoverType === "INTERCEPTION" ? "Interception" : "Fumble";
  }
  return { yards, count, endLabel };
}
function logRow(p, c, sub) {
  const cm = p.computed || {};
  const ev = cm.events || [];
  const boxed = ev.includes("TOUCHDOWN") || ev.includes("FIELD_GOAL_GOOD") || ev.includes("SAFETY");
  let prefix = "";
  if (cm.phase === "PLAY" && cm.down) {
    const ord = ["","1st","2nd","3rd","4th"][cm.down] || "";
    const tg = cm.toGo === null || cm.toGo === undefined ? "" : " & " + cm.toGo;
    prefix = `${ord}${tg} · ${E.displayYardLine(cm.ballOnBefore, cm.possession, c)} — `;
  }
  return `<div class="logrow ${boxed?'boxed':''} ${sub?'sub':''}" data-play="${p.id}">
      ${prefix}${playSummary(p, c)}</div>`;
}
function renderLog() {
  const c = game.config;
  const groups = buildDriveGroups();
  let rows = "";
  for (const g of groups) {
    if (g.kind === "qtr") { rows += `<div class="logqtr">${playSummary(g.play, c)}</div>`; continue; }
    if (g.kind === "kick") { rows += logRow(g.play, c, false); continue; }
    const st = driveStats(g);
    const first = g.plays.find(r => r.p && r.p.computed);
    const startAt = first ? E.displayYardLine(first.p.computed.ballOnBefore, g.team, c) : "";
    rows += `<div class="loghead"><b>${g.team} drive</b> · ${st.count} play${st.count===1?'':'s'}, ${st.yards} yds · ${st.endLabel}${startAt?` <span>· from ${startAt}</span>`:''}</div>`;
    for (const r of g.plays) rows += logRow(r.p, c, !!r._sub || (r.p && r.p.type==="TRY"));
  }
  app.innerHTML = `
    <div class="board">
      <button class="edit" id="logBack">${logReturn === "stats" ? "← Stats" : "← Live"}</button>
      <span style="font-size:15px;font-weight:600;">Play log</span>
      <span class="meta">${game.plays.length} plays</span>
    </div>
    <div class="scroll" style="padding:8px 0 20px;">
      ${rows || '<div class="logqtr">No plays yet</div>'}
      <div class="logqtr" style="color:var(--dim);font-size:11px;">Tap any play to edit it</div>
    </div>`;
  document.getElementById("logBack").onclick = closeLog;
  document.querySelectorAll("[data-play]").forEach(el =>
    el.onclick = () => openEdit(Number(el.dataset.play), "log"));
}

/* ---------- edit screen ---------- */
function renderEdit() {
  const c = game.config;
  const p = game.plays.find(x => x.id === editingId);
  if (!p) { closeEdit(); return; }
  const cm = p.computed || {};
  const ps = pseudoStateFor(p);
  const parts = draft.uneditable ? null : panelParts(ps, c);
  const situ = cm.phase === "PLAY" && cm.down
    ? `${["","1st","2nd","3rd","4th"][cm.down]} & ${cm.toGo ?? "—"} · ${E.displayYardLine(cm.ballOnBefore, cm.possession, c)}`
    : (cm.phase || "");
  const bodyHtml = parts
    ? `<div class="panel"><h3>${parts.title}</h3>${parts.body}
        <button class="save" id="editSaveBtn" ${draftReady()?'':'disabled'}>
          <span>Save changes</span><span class="preview">recalculates forward if positions move</span></button>
       </div>`
    : `<div class="panel"><h3>${p.type}</h3>
        <p style="color:var(--dim);font-size:13px;">This play type has no editable fields.</p></div>`;
  app.innerHTML = `
    <div class="board">
      <button class="edit" id="editBack">← Back</button>
      <span style="font-size:15px;font-weight:600;">Edit play ${p.id}</span>
      <span class="meta">${situ}</span>
    </div>
    <div class="scroll">
      ${bodyHtml}
      <button class="delplay" id="delPlayBtn">Delete this play</button>
    </div>`;
  document.getElementById("editBack").onclick = closeEdit;
  const sv = document.getElementById("editSaveBtn"); if (sv) sv.onclick = onEditSave;
  document.getElementById("delPlayBtn").onclick = onDeletePlay;
  wireDraftControls();
}

function renderTypes(state) {
  if (state.phase !== "PLAY") return "";   // special phases: panel owns the screen
  const fourth = state.down === 4;
  const promo = fourth ? `<div class="promo">
      <button class="${draft&&draft.type==='PUNT'?'sel':''}" data-type="PUNT">Punt</button>
      <button class="${draft&&draft.type==='FG'?'sel':''}" data-type="FG">Field goal</button>
    </div>` : "";
  return `<div class="types">
    ${promo}
    <button class="big ${draft&&draft.type==='RUN'?'sel':''}" data-type="RUN">Run</button>
    <button class="big ${draft&&draft.type==='PASS'?'sel':''}" data-type="PASS">Pass</button>
    <div class="row2">
      ${fourth?'':`<button class="muted ${draft&&draft.type==='PUNT'?'sel':''}" data-type="PUNT">Punt</button>`}
      <button class="muted ${draft&&draft.type==='PENALTY'?'sel':''}" data-type="PENALTY">Penalty</button>
      ${fourth?'':`<button class="muted ${draft&&draft.type==='FG'?'sel':''}" data-type="FG">FG</button>`}
      <button class="muted" data-type="MORE">More</button>
      ${fourth?'<button class="muted" data-type="MORE" style="visibility:hidden"></button><button class="muted" data-type="MORE" style="visibility:hidden"></button>':''}
    </div>
  </div>`;
}

/* chip row helper: single-select buttons bound to a draft field */
function chips(field, options, label) {
  const btns = options.map(([val, txt]) =>
    `<button class="chip ${draft[field]===val?'sel':''}" data-chip="${field}:${val}">${txt}</button>`).join("");
  return `${label?`<label class="grouplabel">${label}</label>`:''}<div class="chiprow">${btns}</div>`;
}
function sideYard(sideField, yardField, frameAbbr, c, label) {
  const opp = E.otherTeam(frameAbbr, c);
  return `${label?`<label class="grouplabel">${label}</label>`:''}
    <div class="fields">
      <div class="field" style="flex:1.4;">
        <label>side</label>
        <div class="chiprow" style="margin:0;">
          <button class="chip ${draft[sideField]==='own'?'sel':''}" data-chip="${sideField}:own">${frameAbbr}</button>
          <button class="chip ${draft[sideField]==='opp'?'sel':''}" data-chip="${sideField}:opp">${opp}</button>
        </div>
      </div>
      ${fieldBox(yardField, "yard line", true)}
    </div>`;
}

function renderPanel(state, c) {
  if (!draft) return `<div class="panel hidden"></div>`;
  const parts = panelParts(state, c);
  if (!parts) return `<div class="panel hidden"></div>`;
  if (parts.noSave) return `<div class="panel"><h3>${parts.title}</h3>${parts.body}</div>`;
  return `<div class="panel"><h3>${parts.title}</h3>${parts.body}${saveButton(state,c)}</div>`;
}

function panelParts(state, c) {
  const d = draft;
  const t = d.type;

  if (t === "PASS" && d.complete === null) {
    return { title: "Pass", noSave: true, body: `
      <div class="passtoggle">
        <button data-complete="yes">Complete</button>
        <button data-complete="no">Incomplete</button>
      </div>` };
  }

  let title = "", body = "";

  if (t === "RUN") {
    title = "Run play";
    body = twoFields(["runner","Runner #",false], ["yards","Yards",true]) + renderPad();
  }
  else if (t === "PASS" && d.complete === false) {
    title = "Incomplete pass";
    body = `<div class="fields">${fieldBox("passer","Passer #",false)}</div>` + renderPad();
  }
  else if (t === "PASS") {
    title = "Completed pass";
    body = `<div class="fields">
        ${fieldBox("passer","Passer #",false)}
        ${fieldBox("receiver","Receiver #",false)}
        ${fieldBox("yards","Yards",true)}
      </div>` + renderPad();
  }
  else if (t === "KICKOFF") {
    title = d.freeKick ? "Free kick" : "Kickoff";
    const needsDist = d.result !== "TOUCHBACK" && d.result !== "TOUCHDOWN";
    const needsRet = d.result === "RETURNED" || d.result === "TOUCHDOWN";
    body = chips("result", [["RETURNED","Returned"],["TOUCHBACK","Touchback"],["OUT_OF_BOUNDS","Out of bounds"],
                            ["ONSIDE_RECOVERED","Onside — kept"],["ONSIDE_LOST","Onside — lost"],["TOUCHDOWN","Return TD"]], "Result")
      + `<div class="fields">
          ${fieldBox("kickFrom","Kick from",false)}
          ${needsDist?fieldBox("distance","Distance",true):''}
          ${needsRet?fieldBox("returnYards","Return yds",false):''}
        </div>`
      + `<div class="fields">${fieldBox("kicker","Kicker #",false)}${needsRet?fieldBox("returner","Returner #",false):''}</div>`
      + renderPad();
  }
  else if (t === "PUNT") {
    title = "Punt";
    const needsDist = d.result !== "TOUCHBACK" && d.result !== "TOUCHDOWN" && d.result !== "MUFFED";
    const needsRet = d.result === "RETURNED" || d.result === "TOUCHDOWN";
    const muffed = d.result === "MUFFED";
    body = chips("result", [["RETURNED","Returned"],["DOWNED","Downed"],["FAIR_CATCH","Fair catch"],["TOUCHBACK","Touchback"],
                            ["OUT_OF_BOUNDS","Out of bounds"],["MUFFED","Muffed"],["TOUCHDOWN","Return TD"]], "Result")
      + (muffed
          ? chips("recTeam", [[state.possession, state.possession+" (kicking)"],[E.otherTeam(state.possession,c), E.otherTeam(state.possession,c)+" (receiving)"]], "Recovered by")
            + sideYard("spotSide","spotYard", d.recTeam || E.otherTeam(state.possession,c), c, "Ball ended up at (recovering team's frame)")
          : `<div class="fields">
              ${needsDist?fieldBox("distance","Distance",true):''}
              ${needsRet?fieldBox("returnYards","Return yds",false):''}
            </div>
            <div class="fields">${fieldBox("punter","Punter #",false)}${needsRet?fieldBox("returner","Returner #",false):''}</div>`)
      + renderPad();
  }
  else if (t === "FG") {
    const dist = (100 - state.ballOn) + 10;
    title = `Field goal — ${dist} yards`;
    body = chips("result", [["GOOD","Good"],["NO_GOOD","No good"],["BLOCKED","Blocked"]], "Result")
      + `<div class="fields">${fieldBox("kicker","Kicker #",false)}</div>` + renderPad();
  }
  else if (t === "PENALTY") {
    title = "Penalty";
    const confirmReady = d.team !== null && d.yards !== null && d.accepted;
    const quick = [5, 10, 15];
    const other = d.yards !== null && !quick.includes(Math.abs(d.yards));
    const sideAbbr = d.confirmSide === "opp" ? E.otherTeam(state.possession, c) : state.possession;
    body = chips("team", [[c.homeTeam.abbr, c.homeTeam.abbr],[c.awayTeam.abbr, c.awayTeam.abbr]], "Penalty on")
      // the usual distances are one tap; odd ones (half the distance) go in the box
      + `<label class="grouplabel">Yards</label><div class="chiprow penyds">
           ${quick.map(v => `<button class="chip ${d.yards === v ? "sel" : ""}" data-chip="yards:${v}">${v}</button>`).join("")}
         </div>`
      + `<div class="fields">${fieldBox("yards","Other yards",true)}${fieldBox("player","Player #",false)}</div>`
      + `<div class="chiprow">
           <button class="chip ${d.accepted === true ? "sel" : ""}" data-chip="accepted:true">Accepted</button>
           <button class="chip ${d.accepted === false ? "sel" : ""}" data-chip="accepted:false">Declined</button>
           ${d.accepted ? `<button class="chip ${d.autoFD ? "sel" : ""}" data-chip="autoFD:true">Auto 1st down</button>` : ""}
         </div>`
      + (!d.accepted ? "" : d.confirmOpen && confirmReady ? `<div class="confirmbox">
            <label class="grouplabel">Set what the refs marked</label>
            ${chips("confirmDown", [[1,"1st"],[2,"2nd"],[3,"3rd"],[4,"4th"]], "")}
            <div class="fields">${fieldBox("confirmToGo","To go",true)}</div>
            ${sideYard("confirmSide","confirmYard", state.possession, c, "Ball on")}
            <button class="confirmdone" data-confirmedit="close">Done</button>
          </div>`
        // one fixed-height line, so entering yards never pushes anything around
        : `<div class="confirmline">${confirmReady && d.confirmDown && d.confirmToGo != null && d.confirmYard != null
            ? `<span>${editingId !== null ? "Recorded result" : "Result"}: <b>${["","1st","2nd","3rd","4th"][d.confirmDown]} &amp; ${d.confirmToGo} at ${esc(sideAbbr)} ${d.confirmYard}</b></span>
               <button data-confirmedit="open">Change</button>`
            : `<span class="dim">Result appears here once team and yards are in</span>`}</div>`)
      + (d.active ? renderPad() : "");
  }
  else if (t === "TURNOVER") {
    title = "Turnover";
    const newTeam = E.otherTeam(state.possession, c);
    const needsSpot = d.result !== "TOUCHBACK" && d.result !== "TOUCHDOWN";
    body = chips("ttype", [["INTERCEPTION","Interception"],["FUMBLE","Fumble lost"]], "Type")
      + chips("result", [["RECOVERED","Recovered"],["TOUCHDOWN","Return TD"],["TOUCHBACK","Touchback"],["OUT_OF_BOUNDS","Out of bounds"]], "Result")
      + (needsSpot ? sideYard("spotSide","spotYard", newTeam, c, `Ball ended up at (${newTeam}'s frame)`) : "")
      + `<div class="fields">
          ${d.ttype==="INTERCEPTION"?fieldBox("thrownBy","Thrown by #",false):fieldBox("lostBy","Lost by #",false)}
          ${fieldBox("recoveredBy","Recovered #",false)}
          ${fieldBox("returnYards","Return yds",false)}
        </div>` + renderPad();
  }
  else if (t === "TRY") {
    title = "Point after try";
    let nums = "";
    if (d.tryType === "KICK") nums = `<div class="fields">${fieldBox("kicker","Kicker #",false)}</div>`;
    if (d.tryType === "RUN") nums = `<div class="fields">${fieldBox("runner","Runner #",false)}</div>`;
    if (d.tryType === "PASS") nums = `<div class="fields">${fieldBox("passer","Passer #",false)}${fieldBox("receiver","Receiver #",false)}</div>`;
    body = chips("tryType", [["KICK","Kick (+1)"],["RUN","Run (+2)"],["PASS","Pass (+2)"]], "Try type")
      + chips("result", [["GOOD","Good"],["NO_GOOD","No good"],["DEFENSIVE_2PT","Def. 2pt return"]], "Result")
      + nums + (d.tryType ? renderPad() : "");
  }
  else if (t === "KNEEL") {
    title = "Kneel down";
    body = `<div class="fields">${fieldBox("player","Player #",false)}</div>` + renderPad();
  }
  else if (t === "TIMEOUT") {
    title = "Timeout";
    const q = editingId !== null ? (game.plays.find(x => x.id === editingId).computed || {}).quarter : state.quarter;
    const left = ab => editingId !== null ? "" : ` · ${timeoutsLeft(ab, q)} left`;
    body = chips("team", [[c.homeTeam.abbr, c.homeTeam.abbr + left(c.homeTeam.abbr)],
                          [c.awayTeam.abbr, c.awayTeam.abbr + left(c.awayTeam.abbr)]], "Called by")
      + `<div class="fields">${fieldBox("clock", "Time left (m:ss)", false)}</div>` + renderPad();
  }
  else return null;

  if (t !== "TIMEOUT" && (draftIsScoring() || (draft.clock !== null && draft.clock !== undefined))) {
    const clockRow = `<div class="fields clockrow">${fieldBox("clock", "Time of score (m:ss)", false)}
      <div class="clockhint">${draft.clock == null ? "Add the scoreboard time" : "Clock on the scoreboard when it scored"}</div></div>`;
    const at = body.lastIndexOf('<div class="pad">');
    body = at >= 0 ? body.slice(0, at) + clockRow + body.slice(at) : body + clockRow + renderPad();
  }
  return { title, body };
}

function twoFields(a, b) {
  return `<div class="fields">${fieldBox(a[0],a[1],a[2])}${fieldBox(b[0],b[1],b[2])}</div>`;
}
function fieldBox(key, label, required) {
  const v = draft[key];
  const empty = v === null || v === undefined;
  const signed = SIGNED_FIELDS[key];
  let shown = empty ? "—" : (signed && v>0 ? "+"+v : ""+v);
  if (key === "clock" && !empty) shown = `${Math.floor(v / 100)}:${String(v % 100).padStart(2, "0")}`;
  const bad = key === "clock" && !clockValid(v);
  return `<div class="field">
    <label>${label}${required?' <span class="req">•</span>':''}</label>
    <div class="val ${draft.active===key?'active':''} ${empty?'empty':''} ${bad?'bad':''}" data-focus="${key}">${shown}</div>
  </div>`;
}
function renderPad() {
  const keys = ["1","2","3","4","5","6","7","8","9","+/-","0","C"];
  const f = draft.active;
  const signable = f && SIGNED_FIELDS[f];
  return `<div class="pad">${keys.map(k => {
    if (k==="+/-" && nextFieldFor(f)) return `<button class="nextkey" data-key="NEXT">next →</button>`;
    if (k==="+/-") return `<button class="sign ${signable&&draft[f]<0?'neg':''}" data-key="+/-" ${signable?'':'disabled style="opacity:.3"'}>±</button>`;
    if (k==="C") return `<button class="clr" data-key="C">clear</button>`;
    return `<button data-key="${k}">${k}</button>`;
  }).join("")}</div>`;
}
function saveButton(state, c) {
  const ready = draftReady();
  let prevTxt = "enter required fields";
  if (draft && !clockValid(draft.clock)) prevTxt = `check the time — m:ss, up to ${game.config.quarterLength}`;
  if (ready) {
    const ns = preview();
    if (ns.phase === "PLAY") {
      const ord = ["","1st","2nd","3rd","4th"][ns.down];
      const tg = ns.goalToGo ? "goal" : E.toGo(ns);
      prevTxt = `ball to ${E.displayYardLine(ns.ballOn, ns.possession, c)} · ${ord} & ${tg}`;
    } else if (ns.phase === "TRY") {
      prevTxt = `touchdown · ${ns.possession} ${ns.score[ns.possession]}`;
    } else if (ns.phase === "KICKOFF" || ns.phase === "FREE_KICK") {
      const h = c.homeTeam.abbr, a = c.awayTeam.abbr;
      prevTxt = `${h} ${ns.score[h]} — ${a} ${ns.score[a]} · ${ns.possession} kicks`;
    } else {
      prevTxt = `${ns.possession} ball`;
    }
  }
  return `<button class="save" id="saveBtn" ${ready?'':'disabled'}>
    <span>Save play</span><span class="preview">${prevTxt}</span></button>`;
}

function renderLast(c) {
  const last = game.plays[game.plays.length-1];
  if (!last) return `<div class="last empty"><span class="txt">No plays yet — enter the opening kickoff above</span></div>`;
  return `<div class="last"><span class="txt" id="lastTxt" style="cursor:pointer;">Last: <b>${playSummary(last,c)}</b></span>
    <button class="edit" id="undoBtn">Undo</button>
    <button class="edit" id="editBtn">Edit</button></div>`;
}
function playSummary(p, c) {
  const base = playSummaryBase(p, c);
  return p.input && p.input.clock != null ? `${base} · ${quarterLabel(p.computed.quarter)} ${fmtClock(p.input.clock)}` : base;
}
function playSummaryBase(p, c) {
  const cm = p.computed;
  const inp = p.input;
  const at = E.displayYardLine(cm.ballOnAfter, cm.possessionAfter, c);
  const td = cm.events && cm.events.includes("TOUCHDOWN") ? " · TD" : "";
  switch (p.type) {
    case "RUN": {
      const y = inp.yards;
      return `Run${inp.runner?' #'+inp.runner:''} ${y>=0?'+'+y:y}${td || ' → '+at}`;
    }
    case "PASS": {
      if (!inp.complete) return `Pass${inp.passer?' #'+inp.passer:''} incomplete`;
      const r = inp.receiver?' → #'+inp.receiver:'';
      return `Pass${inp.passer?' #'+inp.passer:''}${r} +${inp.yards}${td || ' → '+at}`;
    }
    case "KICKOFF": {
      const lbl = cm.phase === "FREE_KICK" ? "Free kick" : "Kickoff";
      if (inp.result === "TOUCHBACK") return `${lbl}, touchback → ${at}`;
      if (inp.result === "ONSIDE_RECOVERED") return `${lbl}, onside kept → ${at}`;
      if (inp.result === "ONSIDE_LOST") return `${lbl}, onside lost → ${at}`;
      if (inp.result === "OUT_OF_BOUNDS") return `${lbl} out of bounds → ${at}`;
      return `${lbl} +${inp.distance||0}, ret ${inp.returnYards||0}${td || ' → '+at}`;
    }
    case "PUNT": {
      if (inp.result === "TOUCHBACK") return `Punt, touchback → ${at}`;
      if (inp.result === "DOWNED") return `Punt ${inp.distance||0}, downed → ${at}`;
      if (inp.result === "FAIR_CATCH") return `Punt ${inp.distance||0}, fair catch → ${at}`;
      if (inp.result === "MUFFED") return `Punt muffed, ${inp.recoveredByTeam} ball → ${at}`;
      if (inp.result === "OUT_OF_BOUNDS") return `Punt ${inp.distance||0} OOB → ${at}`;
      return `Punt ${inp.distance||0}, ret ${inp.returnYards||0}${td || ' → '+at}`;
    }
    case "FIELD_GOAL": {
      const dist = (100 - cm.ballOnBefore) + 10;
      return inp.result === "GOOD" ? `FG ${dist} good` :
             inp.result === "BLOCKED" ? `FG ${dist} blocked → ${at}` : `FG ${dist} no good → ${at}`;
    }
    case "PENALTY":
      return inp.accepted ? `Penalty ${inp.team} ${inp.yards} → ${at}` : `Penalty ${inp.team} declined`;
    case "TURNOVER": {
      const w = inp.turnoverType === "INTERCEPTION" ? "INT" : "Fumble lost";
      return `${w}${inp.thrownBy?' #'+inp.thrownBy:''}${td || ' → '+at}`;
    }
    case "TRY": {
      const kind = inp.tryType === "KICK" ? "kick" : inp.tryType === "RUN" ? "run" : "pass";
      const res = inp.result === "GOOD" ? "good" : inp.result === "DEFENSIVE_2PT" ? "def. 2pt!" : "no good";
      return `Try: ${kind} ${res}`;
    }
    case "KNEEL": return `Kneel${inp.player?' #'+inp.player:''}`;
    case "TIMEOUT": return `Timeout ${inp.team}`;
    case "QUARTER_END":
      if (inp.halftimeKicker && cm.quarter === 2) return `Halftime · ${inp.halftimeKicker} kicks off the second half`;
      return `End of quarter → Q${cm.quarter === 4 ? 'OT' : (typeof cm.quarter === 'number' ? cm.quarter+1 : 'OT')}`;
    case "SET_SPOT": return `Ball set → ${at}`;
    default: return p.type;
  }
}

/* ---------- Phase 5: stats screens ---------- */
let statsView = "summary";      // summary | box
let boxTeam = null;             // abbr shown in the box score

function openStats() { screen = "stats"; statsView = "summary"; draft = null; render(); }
function closeStats() { screen = "live"; render(); }
function openBox(abbr) { statsView = "box"; boxTeam = abbr; render(); }

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[ch]);
}
const fmtLong = v => v === null || v === undefined ? "—" : String(v);
const fmtAvg = (y, n) => n ? (y / n).toFixed(1) : "—";
const who = r => r.player === null ? "No #" : "#" + r.player;

function statsColors() {
  return { home: readable(teamColor("home"), "#3ddc84"), away: readable(teamColor("away"), "#5b9dff") };
}

function renderStats() {
  const S = FootballStats.aggregate(game);
  if (statsView === "box") { renderBox(S); return; }
  const c = game.config, H = S.home, A = S.away;
  const th = S.teams[H], ta = S.teams[A];
  const col = statsColors();

  /* score header + line score */
  const qCols = S.overtime ? ["1","2","3","4","OT"] : ["1","2","3","4"];
  const lineRow = (ab, color) => `<tr><th style="color:${color}">${esc(ab)}</th>${
    qCols.map((_, i) => `<td>${S.line[ab][i]}</td>`).join("")}<td class="tot">${S.teams[ab].totals.points}</td></tr>`;

  /* team totals, side by side */
  const a = th.totals, b = ta.totals;
  const downStr = (cv, at) => at ? `${cv} of ${at}` : "—";
  const cmpRows = [
    ["First downs", a.firstDowns, b.firstDowns],
    ["Total yards", a.totalYds, b.totalYds],
    ["Rushing", `${a.rushAtt} for ${a.rushYds}`, `${b.rushAtt} for ${b.rushYds}`, "att for yds"],
    ["Passing", `${a.passComp}–${a.passAtt}–${a.passInt}`, `${b.passComp}–${b.passAtt}–${b.passInt}`, "comp–att–int"],
    ["Passing yards", a.passYds, b.passYds],
    ["Yards per play", a.ypp === null ? "—" : a.ypp.toFixed(1), b.ypp === null ? "—" : b.ypp.toFixed(1)],
    ["Turnovers", a.turnovers, b.turnovers],
    ["Penalties", `${a.penalties}–${a.penYds}`, `${b.penalties}–${b.penYds}`, "no.–yds"],
    ["3rd down", downStr(a.thirdConv, a.thirdAtt), downStr(b.thirdConv, b.thirdAtt)],
    ["4th down", downStr(a.fourthConv, a.fourthAtt), downStr(b.fourthConv, b.fourthAtt)]
  ].map(([lbl, l, r, hint]) => `<div class="cmp"><span class="l">${l}</span>
      <span class="m">${lbl}${hint ? `<small>${hint}</small>` : ""}</span><span class="r">${r}</span></div>`).join("");

  /* leaders: numbered players only */
  const L = FootballStats.leader;
  const leadCell = (row, kind, color) => {
    if (!row) return `<div class="ldr-cell empty" style="border-color:${color}">—</div>`;
    let line;
    if (kind === "rush") line = `${row.att} car, ${row.yds} yds${row.td ? `, ${row.td} TD` : ""}`;
    if (kind === "pass") line = `${row.comp}/${row.att}, ${row.yds} yds${row.td ? `, ${row.td} TD` : ""}${row.int ? `, ${row.int} INT` : ""}`;
    if (kind === "rec")  line = `${row.rec} rec, ${row.yds} yds${row.td ? `, ${row.td} TD` : ""}`;
    return `<div class="ldr-cell" style="border-color:${color}"><b>#${row.player}</b><span>${line}</span></div>`;
  };
  const leaders = [["Rushing","rushing","rush"],["Passing","passing","pass"],["Receiving","receiving","rec"]]
    .map(([lbl, table, kind]) => `<div class="ldr"><div class="ldr-cat">${lbl}</div><div class="ldr-cells">
        ${leadCell(L(th, table), kind, col.home)}${leadCell(L(ta, table), kind, col.away)}</div></div>`).join("");

  /* scoring summary */
  const scoringRows = S.scoring.map(e => {
    const qn = typeof e.quarter === "number" ? "Q" + e.quarter : "OT";
    const color = e.team === H ? col.home : col.away;
    const tm = e.clock != null ? `<span class="tm">${fmtClock(e.clock)}</span>` : `<span class="tm missing">add time</span>`;
    return `<div class="scr" data-scoreplay="${e.playId}"><span class="q">${qn}<br>${tm}</span>
      <span class="who" style="color:${color}">${esc(e.team)}</span>
      <span class="what">${esc(e.text)}</span>
      <span class="sc">${esc(FootballStats.scoreLine(e.home, e.away, H, A))}</span></div>`;
  }).join("");
  const timeoutRows = S.timeouts.map(t => {
    const color = t.team === H ? col.home : col.away;
    const tm = t.clock != null ? `<span class="tm">${fmtClock(t.clock)}</span>` : `<span class="tm missing">add time</span>`;
    return `<div class="scr to" data-scoreplay="${t.playId}"><span class="q">${quarterLabel(t.quarter)}<br>${tm}</span>
      <span class="who" style="color:${color}">${esc(t.team)}</span><span class="what">Timeout</span><span></span></div>`;
  }).join("");

  app.innerHTML = `
    <div class="board">
      <button class="edit" id="statsBack">← Live</button>
      <span style="font-size:15px;font-weight:600;">Stats</span>
      <span class="meta">${game.plays.length} plays</span>
    </div>
    <div class="scroll stats">
      ${S.status === "Final" ? `<div class="panel final-panel"><h3>Final — send the box score</h3>${emailBlock("fin")}</div>` : ""}
      <div class="st-score">
        <div class="st-team"><span class="abbr" style="color:${col.home}">${esc(H)}</span><span class="pts">${a.points}</span></div>
        <div class="st-status">${esc(S.status)}</div>
        <div class="st-team"><span class="pts">${b.points}</span><span class="abbr" style="color:${col.away}">${esc(A)}</span></div>
      </div>
      <table class="linescore"><tr><th></th>${qCols.map(q => `<th>${q}</th>`).join("")}<th class="tot">T</th></tr>
        ${lineRow(H, col.home)}${lineRow(A, col.away)}</table>

      <div class="panel st-panel"><h3>Team stats</h3>
        <div class="cmp head"><span class="l" style="color:${col.home}">${esc(H)}</span><span class="m"></span>
          <span class="r" style="color:${col.away}">${esc(A)}</span></div>
        ${cmpRows}
      </div>

      <div class="panel st-panel"><h3>Leaders</h3>${leaders}</div>

      <div class="panel st-panel"><h3>Scoring</h3>
        ${scoringRows || '<div class="st-empty">No points yet.</div>'}
      </div>

      <div class="panel st-panel"><h3>Timeouts</h3>
        ${timeoutRows || '<div class="st-empty">No timeouts yet.</div>'}
      </div>

      <div class="st-actions">
        <button id="boxHome">${esc(th.name)} box score</button>
        <button id="boxAway">${esc(ta.name)} box score</button>
      </div>
      <button class="save" id="shareBtn"><span>Share & email</span><span class="preview">PDF, text or backup file</span></button>
    </div>`;
  document.getElementById("statsBack").onclick = closeStats;
  document.getElementById("boxHome").onclick = () => openBox(H);
  document.getElementById("boxAway").onclick = () => openBox(A);
  document.getElementById("shareBtn").onclick = () => openShare(S);
  if (S.status === "Final") wireEmailBlock("fin", S);
  document.querySelectorAll("[data-scoreplay]").forEach(el =>
    el.onclick = () => openEdit(Number(el.dataset.scoreplay), "stats", "clock"));
}

/* full box score for one team; unattributed rows link to the play log */
function renderBox(S) {
  const H = S.home, A = S.away;
  if (boxTeam !== H && boxTeam !== A) boxTeam = H;
  const t = S.teams[boxTeam], tt = t.totals;
  const col = statsColors();
  const myColor = boxTeam === H ? col.home : col.away;

  let anyNoNum = false;
  function table(title, heads, rows, cells, totalCells) {
    if (!rows.length) return "";
    const body = rows.map(r => {
      const none = r.player === null;
      if (none) anyNoNum = true;
      return `<tr class="${none ? "nonum" : ""}" ${none ? 'data-nonum="1"' : ""}><th>${who(r)}</th>${
        cells(r).map(v => `<td>${v}</td>`).join("")}</tr>`;
    }).join("");
    const total = totalCells && rows.length > 1
      ? `<tr class="total"><th>Team</th>${totalCells.map(v => `<td>${v}</td>`).join("")}</tr>` : "";
    return `<div class="panel st-panel"><h3>${title}</h3><div class="bxwrap"><table class="bx">
      <tr><th></th>${heads.map(h => `<td>${h}</td>`).join("")}</tr>${body}${total}</table></div></div>`;
  }
  const sum = (rows, k) => rows.reduce((n, r) => n + r[k], 0);
  const maxL = (rows, k) => rows.reduce((m, r) => r[k] === null ? m : (m === null || r[k] > m ? r[k] : m), null);

  const R = t.rushing, P = t.passing, C = t.receiving;
  const html =
    table("Rushing", ["Att","Yds","Avg","TD","Long"], R,
      r => [r.att, r.yds, fmtAvg(r.yds, r.att), r.td, fmtLong(r.long)],
      [sum(R,"att"), sum(R,"yds"), fmtAvg(sum(R,"yds"), sum(R,"att")), sum(R,"td"), fmtLong(maxL(R,"long"))]) +
    table("Passing", ["C/A","Yds","TD","Int","Long"], P,
      r => [`${r.comp}/${r.att}`, r.yds, r.td, r.int, fmtLong(r.long)],
      [`${sum(P,"comp")}/${sum(P,"att")}`, sum(P,"yds"), sum(P,"td"), sum(P,"int"), fmtLong(maxL(P,"long"))]) +
    table("Receiving", ["Rec","Yds","Avg","TD","Long"], C,
      r => [r.rec, r.yds, fmtAvg(r.yds, r.rec), r.td, fmtLong(r.long)],
      [sum(C,"rec"), sum(C,"yds"), fmtAvg(sum(C,"yds"), sum(C,"rec")), sum(C,"td"), fmtLong(maxL(C,"long"))]) +
    table("Kicking", ["FG","Long","PAT","KO","TB"], t.kicking,
      r => [r.fga ? `${r.fgm}/${r.fga}` : "—", fmtLong(r.fgLong), r.pata ? `${r.patm}/${r.pata}` : "—", r.ko, r.koTB]) +
    table("Punting", ["No","Yds","Avg","Long"], t.punting,
      r => [r.no, r.yds, fmtAvg(r.yds, r.no), fmtLong(r.long)]) +
    table("Kick returns", ["No","Yds","Avg","TD","Long"], t.kickReturns,
      r => [r.no, r.yds, fmtAvg(r.yds, r.no), r.td, fmtLong(r.long)]) +
    table("Punt returns", ["No","Yds","Avg","TD","Long"], t.puntReturns,
      r => [r.no, r.yds, fmtAvg(r.yds, r.no), r.td, fmtLong(r.long)]) +
    table("Defense", ["Int","Ret yds","Fum rec","TD"], t.defense,
      r => [r.int, r.intYds, r.fr, r.td]);

  const fdLine = `${tt.firstDowns} first down${tt.firstDowns === 1 ? "" : "s"} (${tt.fdRush} rush, ${tt.fdPass} pass, ${tt.fdPen} penalty)`;
  const toLine = `${tt.turnovers} turnover${tt.turnovers === 1 ? "" : "s"} (${tt.fumblesLost} fumble${tt.fumblesLost === 1 ? "" : "s"}, ${tt.passInt} INT)`;
  const twoPt = tt.twoPtAtt ? `<div>2-pt tries: ${tt.twoPtMade} of ${tt.twoPtAtt}</div>` : "";

  app.innerHTML = `
    <div class="board">
      <button class="edit" id="boxBack">← Summary</button>
      <span style="font-size:15px;font-weight:600;">Box score</span>
      <span class="meta">${esc(S.status)}</span>
    </div>
    <div class="colorbars"><div class="cbar" style="background:${myColor}"></div></div>
    <div class="scroll stats">
      <div class="chiprow bx-tabs">
        <button class="chip ${boxTeam === H ? "sel" : ""}" data-boxteam="${esc(H)}">${esc(S.teams[H].name)}</button>
        <button class="chip ${boxTeam === A ? "sel" : ""}" data-boxteam="${esc(A)}">${esc(S.teams[A].name)}</button>
      </div>
      <div class="bx-sum">
        <div><b>${tt.points}</b> points, <b>${tt.totalYds}</b> total yards on ${tt.plays} plays</div>
        <div>${fdLine}</div><div>${toLine}</div>
        <div>${tt.penalties} penalt${tt.penalties === 1 ? "y" : "ies"} for ${tt.penYds} yards</div>${twoPt}
      </div>
      ${html || '<div class="st-empty">No plays for this team yet.</div>'}
      ${anyNoNum ? '<div class="st-note">“No #” rows are plays entered without a jersey number. Tap one to open the play log and add numbers.</div>' : ""}
    </div>`;
  document.getElementById("boxBack").onclick = () => { statsView = "summary"; render(); };
  document.querySelectorAll("[data-boxteam]").forEach(b => b.onclick = () => openBox(b.dataset.boxteam));
  document.querySelectorAll("[data-nonum]").forEach(r => r.onclick = () => openLog("stats"));
}

/* ---------- printable box score (PDF) ----------
   A tiny PDF writer: standard Helvetica/Courier fonts that every PDF viewer
   and printer has, so nothing is downloaded and it works with no signal.
   Tables are set in Courier so columns line up on paper. */
const PDF_WINANSI = { "–":"\\226", "—":"\\227", "·":"\\267", "’":"\\222", "‘":"\\221", "“":"\\223", "”":"\\224", "•":"\\225" };
function pdfStr(t) {
  let out = "";
  for (const ch of String(t)) {
    if (ch === "\\" || ch === "(" || ch === ")") out += "\\" + ch;
    else if (PDF_WINANSI[ch]) out += PDF_WINANSI[ch];
    else if (ch.charCodeAt(0) < 32 || ch.charCodeAt(0) > 126) out += "?";
    else out += ch;
  }
  return out;
}
function pdfDocument(pages) {           // pages: arrays of PDF content-stream strings
  const objs = [];
  const add = body => { objs.push(body); return objs.length; };
  const catalog = add(null), pagesObj = add(null);
  const font = name => add(`<< /Type /Font /Subtype /Type1 /BaseFont /${name} /Encoding /WinAnsiEncoding >>`);
  const F = { F1: font("Helvetica"), F2: font("Helvetica-Bold"), F3: font("Courier"), F4: font("Courier-Bold") };
  const fontRes = `<< ${Object.entries(F).map(([k, v]) => `/${k} ${v} 0 R`).join(" ")} >>`;
  const kids = pages.map(ops => {
    const stream = ops.join("\n");
    const content = add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    return add(`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 612 792] /Resources << /Font ${fontRes} >> /Contents ${content} 0 R >>`);
  });
  objs[catalog - 1] = `<< /Type /Catalog /Pages ${pagesObj} 0 R >>`;
  objs[pagesObj - 1] = `<< /Type /Pages /Kids [${kids.map(k => k + " 0 R").join(" ")}] /Count ${kids.length} >>`;
  let pdf = "%PDF-1.4\n";
  const offsets = [];
  objs.forEach((body, i) => { offsets.push(pdf.length); pdf += `${i + 1} 0 obj\n${body}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` +
    offsets.map(o => String(o).padStart(10, "0") + " 00000 n \n").join("") +
    `trailer\n<< /Size ${objs.length + 1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([pdf], { type: "application/pdf" });
}

function buildBoxScorePdf() {
  const S = FootballStats.aggregate(game), c = game.config, H = S.home, A = S.away;
  const th = S.teams[H], ta = S.teams[A];
  const clk = FootballStats.clockStr;
  const pages = [];
  let ops = [], y = 0;
  const L = 50, W = 512, BOTTOM = 56;
  function newPage() {
    ops = []; pages.push(ops); y = 742;
    ops.push(`BT /F1 8 Tf 0.45 g ${L} 30 Td (${pdfStr(`${th.name} vs ${ta.name}  \u00b7  ${FootballStats.gameDate(game)}  \u00b7  page ${pages.length}`)}) Tj ET`);
  }
  const need = h => { if (y - h < BOTTOM) newPage(); };
  const text = (str, f, size, x, gray) =>
    ops.push(`BT /${f} ${size} Tf ${gray || 0} g ${x} ${y} Td (${pdfStr(str)}) Tj ET`);
  const rule = () => ops.push(`0.75 G 0.6 w ${L} ${y + 4} m ${L + W} ${y + 4} l S`);
  function heading(str) { need(34); y -= 12; text(str, "F2", 12, L); y -= 9; rule(); y -= 10; }
  const MONO = 9.5, MAXC = Math.floor(W / (MONO * 0.6));
  function mono(str, bold) {
    // wrap long lines on spaces, indenting continuations
    let rest = str;
    while (rest.length) {
      let cut = rest.length <= MAXC ? rest.length : rest.lastIndexOf(" ", MAXC);
      if (cut <= 10) cut = Math.min(MAXC, rest.length);
      need(13); text(rest.slice(0, cut), bold ? "F4" : "F3", MONO, L); y -= 12.5;
      rest = rest.slice(cut).trimStart(); if (rest) rest = "      " + rest;
    }
  }
  const padR = (v, n) => String(v).padEnd(n).slice(0, n);
  const padL = (v, n) => String(v).padStart(n);
  function table(title, heads, rows, cells, total) {
    if (!rows.length) return;
    need(16 + 13 * Math.min(rows.length + 1, 4));
    y -= 4; text(title, "F2", 10, L); y -= 13;
    const line = (who, vals, bold) => mono(padR(who, 10) + vals.map(v => padL(v, 8)).join(""), bold);
    line("", heads, true);
    rows.forEach(r => line(r.player === null ? "No #" : "#" + r.player, cells(r)));
    if (total && rows.length > 1) line("Team", total, true);
    y -= 4;
  }
  const avg = (a, b) => b ? (a / b).toFixed(1) : "-";
  const lng = v => v === null || v === undefined ? "-" : v;
  const sum = (rows, k) => rows.reduce((n, r) => n + r[k], 0);
  const maxL = (rows, k) => rows.reduce((m, r) => r[k] === null ? m : (m === null || r[k] > m ? r[k] : m), null);

  newPage();
  // title block
  text(`${th.name} ${th.totals.points}, ${ta.name} ${ta.totals.points}`, "F2", 20, L); y -= 18;
  text(`${S.status}  \u00b7  ${FootballStats.gameDate(game)}  \u00b7  ${c.quarterLength} quarters`, "F1", 10.5, L, 0.35); y -= 10;

  heading("Score by quarter");
  const qCols = S.overtime ? ["1","2","3","4","OT"] : ["1","2","3","4"];
  mono(padR("", 18) + qCols.map(q => padL(q, 6)).join("") + padL("T", 8), true);
  for (const ab of [H, A]) {
    const t = S.teams[ab];
    mono(padR(t.name, 18) + qCols.map((_, i) => padL(S.line[ab][i], 6)).join("") + padL(t.totals.points, 8), false);
  }

  heading("Scoring");
  if (!S.scoring.length) mono("No scoring.");
  S.scoring.forEach(e => mono(`${padR(quarterLabel(e.quarter) + " " + (e.clock != null ? clk(e.clock) : "--:--"), 9)} ${padR(e.team, 5)}${e.text}  (${FootballStats.scoreLine(e.home, e.away, H, A)})`));

  heading("Timeouts");
  if (!S.timeouts.length) mono("None recorded.");
  for (const ab of [H, A]) {
    const list = S.timeouts.filter(t => t.team === ab).map(t => `${quarterLabel(t.quarter)} ${t.clock != null ? clk(t.clock) : "--:--"}`);
    if (list.length) mono(`${padR(ab, 5)}${list.join(",  ")}`);
  }

  heading("Team statistics");
  const a = th.totals, b = ta.totals;
  const dn = (cv, at) => at ? `${cv}-${at}` : "-";
  const cmp = [
    ["First downs", a.firstDowns, b.firstDowns],
    ["  Rush-pass-penalty", `${a.fdRush}-${a.fdPass}-${a.fdPen}`, `${b.fdRush}-${b.fdPass}-${b.fdPen}`],
    ["Total yards", a.totalYds, b.totalYds],
    ["Total plays", a.plays, b.plays],
    ["Yards per play", a.ypp === null ? "-" : a.ypp.toFixed(1), b.ypp === null ? "-" : b.ypp.toFixed(1)],
    ["Rushes / yards", `${a.rushAtt} / ${a.rushYds}`, `${b.rushAtt} / ${b.rushYds}`],
    ["Comp-att-int", `${a.passComp}-${a.passAtt}-${a.passInt}`, `${b.passComp}-${b.passAtt}-${b.passInt}`],
    ["Passing yards", a.passYds, b.passYds],
    ["Fumbles lost", a.fumblesLost, b.fumblesLost],
    ["Turnovers", a.turnovers, b.turnovers],
    ["Penalties-yards", `${a.penalties}-${a.penYds}`, `${b.penalties}-${b.penYds}`],
    ["3rd down", dn(a.thirdConv, a.thirdAtt), dn(b.thirdConv, b.thirdAtt)],
    ["4th down", dn(a.fourthConv, a.fourthAtt), dn(b.fourthConv, b.fourthAtt)],
    ["2-pt conversions", dn(a.twoPtMade, a.twoPtAtt), dn(b.twoPtMade, b.twoPtAtt)]
  ];
  mono(padR("", 22) + padL(H, 14) + padL(A, 14), true);
  cmp.forEach(([l, x, z]) => mono(padR(l, 22) + padL(x, 14) + padL(z, 14)));

  for (const ab of [H, A]) {
    const t = S.teams[ab], R = t.rushing, P = t.passing, C = t.receiving;
    heading(`${t.name} individual statistics`);
    const before = pages.length * 10000 + ops.length;
    table("Rushing", ["Att","Yds","Avg","TD","Long"], R, r => [r.att, r.yds, avg(r.yds, r.att), r.td, lng(r.long)],
      [sum(R,"att"), sum(R,"yds"), avg(sum(R,"yds"), sum(R,"att")), sum(R,"td"), lng(maxL(R,"long"))]);
    table("Passing", ["C-A","Yds","TD","Int","Long"], P, r => [`${r.comp}-${r.att}`, r.yds, r.td, r.int, lng(r.long)],
      [`${sum(P,"comp")}-${sum(P,"att")}`, sum(P,"yds"), sum(P,"td"), sum(P,"int"), lng(maxL(P,"long"))]);
    table("Receiving", ["Rec","Yds","Avg","TD","Long"], C, r => [r.rec, r.yds, avg(r.yds, r.rec), r.td, lng(r.long)],
      [sum(C,"rec"), sum(C,"yds"), avg(sum(C,"yds"), sum(C,"rec")), sum(C,"td"), lng(maxL(C,"long"))]);
    table("Kicking", ["FG","Long","PAT","KO","TB"], t.kicking,
      r => [r.fga ? `${r.fgm}-${r.fga}` : "-", lng(r.fgLong), r.pata ? `${r.patm}-${r.pata}` : "-", r.ko, r.koTB]);
    table("Punting", ["No","Yds","Avg","Long"], t.punting, r => [r.no, r.yds, avg(r.yds, r.no), lng(r.long)]);
    table("Kick returns", ["No","Yds","Avg","TD","Long"], t.kickReturns, r => [r.no, r.yds, avg(r.yds, r.no), r.td, lng(r.long)]);
    table("Punt returns", ["No","Yds","Avg","TD","Long"], t.puntReturns, r => [r.no, r.yds, avg(r.yds, r.no), r.td, lng(r.long)]);
    table("Defense", ["Int","IntYds","FumRec","TD"], t.defense, r => [r.int, r.intYds, r.fr, r.td]);
    if (pages.length * 10000 + ops.length === before) mono("No individual statistics recorded.");
  }
  const hasNoNum = [H, A].some(ab => ["rushing","passing","receiving","kicking","punting","kickReturns","puntReturns","defense"]
    .some(k => S.teams[ab][k].some(r => r.player === null)));
  if (hasNoNum) { y -= 6; need(14); text("\u201cNo #\u201d = plays recorded without a jersey number.", "F1", 8.5, L, 0.45); }
  return pdfDocument(pages);
}
function boxScoreFilename(ext) {
  const c = game.config;
  const slug = v => String(v || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const d = new Date((game.plays[0] && game.plays[0].timestamp) || Date.now());
  const ymd = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  return `${slug(c.homeTeam.name)}-vs-${slug(c.awayTeam.name)}-${ymd}-box-score.${ext}`;
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------- email ----------
   A web page can't send mail by itself, so the phone's Mail app does it:
   - PDF: the phone's share sheet, with the PDF already attached; pick Mail.
   - Text: opens Mail with the saved address, subject and box score filled in. */
const EMAIL_KEY = "riverview_email";
const savedEmail = () => { try { return localStorage.getItem(EMAIL_KEY) || ""; } catch (e) { return ""; } };
function rememberEmail(v) { try { localStorage.setItem(EMAIL_KEY, v.trim()); } catch (e) {} }
function emailSubject(S) {
  const th = S.teams[S.home], ta = S.teams[S.away];
  return `${th.name} ${th.totals.points}, ${ta.name} ${ta.totals.points} (${S.status}) — box score`;
}
async function emailPdf(S, statusEl) {
  const blob = buildBoxScorePdf();
  const name = boxScoreFilename("pdf");
  const file = new File([blob], name, { type: "application/pdf" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: emailSubject(S) });
      if (statusEl) statusEl.textContent = "Sent to the share sheet.";
    } catch (e) {
      if (e && e.name !== "AbortError" && statusEl) statusEl.textContent = "Couldn't open the share sheet. Use Download PDF instead.";
    }
    return;
  }
  // no file sharing (most desktops): save the PDF, then open a mail draft to attach it to
  downloadBlob(blob, name);
  const to = savedEmail();
  const body = `The printable box score was saved to your Downloads as ${name}. Attach it to this email.\n\n` +
               FootballStats.toText(S, game);
  openMailto(`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(emailSubject(S))}&body=${encodeURIComponent(body)}`);
  if (statusEl) statusEl.textContent = "PDF downloaded — attach it to the email draft.";
}
function openMailto(url) { window.location.href = url; }
function emailText(S) {
  const to = savedEmail();
  openMailto(`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(emailSubject(S))}&body=${encodeURIComponent(FootballStats.toText(S, game))}`);
}

/* ---------- share / backup ---------- */
function backupFilename() {
  const c = game.config;
  const d = new Date();
  const ymd = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const slug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return `${slug(c.homeTeam.name)}-vs-${slug(c.awayTeam.name)}-${c.date || ymd}.json`;
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext)
    return navigator.clipboard.writeText(text).then(() => true, () => fallbackCopy(text));
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  return ok;
}
function emailBlock(idp) {
  return `<label class="grouplabel" for="${idp}Email">Email to</label>
    <input class="emailin" id="${idp}Email" type="email" inputmode="email" autocomplete="email"
           placeholder="you@example.com" value="${esc(savedEmail())}">
    <button class="sel" id="${idp}Pdf" style="text-align:center;">Email printable PDF</button>
    <button id="${idp}Txt" style="text-align:center;">Email as text</button>
    <div class="emailnote" id="${idp}Note">PDF opens your share sheet with the box score attached. Pick Mail and enter the address.
      Text opens Mail already addressed to the email above.</div>`;
}
function wireEmailBlock(idp, S) {
  const inp = document.getElementById(idp + "Email");
  const note = document.getElementById(idp + "Note");
  inp.onchange = inp.onblur = () => rememberEmail(inp.value);
  document.getElementById(idp + "Pdf").onclick = () => { rememberEmail(inp.value); emailPdf(S, note); };
  document.getElementById(idp + "Txt").onclick = () => {
    rememberEmail(inp.value);
    if (!inp.value.trim()) { note.textContent = "Enter an email address first."; inp.focus(); return; }
    emailText(S);
  };
}
function openShare(S) {
  const text = FootballStats.toText(S, game);
  openSheet(`
    <h3>Share & email</h3>
    ${emailBlock("sh")}
    <label class="grouplabel">More</label>
    <div class="sharegrid">
      <button id="exPdf">Download PDF</button>
      <button id="exCopy">Copy text</button>
    </div>
    <button id="exJson">Download backup file</button>
    <details class="exportwrap"><summary>Preview text</summary><pre class="exporttext" id="exText">${esc(text)}</pre></details>
    <button class="cancel" id="exClose">Close</button>
  `);
  wireEmailBlock("sh", S);
  document.getElementById("exPdf").onclick = () => downloadBlob(buildBoxScorePdf(), boxScoreFilename("pdf"));
  const cp = document.getElementById("exCopy");
  cp.onclick = () => copyText(text).then(ok => { cp.textContent = ok ? "Copied" : "Copy failed"; });
  document.getElementById("exJson").onclick = downloadBackup;
  document.getElementById("exClose").onclick = closeSheet;
}
function downloadBackup() {
  const blob = new Blob([JSON.stringify(slimGame(game), null, 1)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = backupFilename();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function restoreBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let g;
    try {
      g = JSON.parse(reader.result);
      if (!g || !g.config || !g.config.homeTeam || !g.config.awayTeam || !Array.isArray(g.plays))
        throw new Error("not a game file");
      g.plays.forEach(p => { p.editHistory = p.editHistory || []; });
      g.nextId = g.nextId || (g.plays.reduce((m, p) => Math.max(m, p.id || 0), 0) + 1);
      E.reduceGame(g);
    } catch (e) {
      alert("That file isn't a game backup from this app. Choose a .json file saved with Download backup file.");
      return;
    }
    if (localStorage.getItem(STORE_KEY) &&
        !confirm(`Load ${g.config.homeTeam.name} vs ${g.config.awayTeam.name} (${g.plays.length} plays)?\n\nThis replaces the game saved on this device.`)) return;
    game = g; draft = null; screen = "live";
    save(); render();
  };
  reader.readAsText(file);
}

/* ---------- setup screen ---------- */
let setupKick = null;
function renderSetup() {
  const saved = localStorage.getItem(STORE_KEY);
  app.innerHTML = `
    <div class="setup">
      <h1>New game</h1>
      <p>Two teams, who kicks off, and you're live. Abbreviations fill in from the names.</p>
      <label>Home team</label>
      <input id="home" placeholder="HOME" autocomplete="off">
      <label>Home color</label>
      ${colorPicker("home", null)}
      <label>Away team</label>
      <input id="away" placeholder="AWAY" autocomplete="off">
      <label>Away color</label>
      ${colorPicker("away", null)}
      <label>Quarter length</label>
      <select id="qlen"><option>12:00</option><option>15:00</option></select>
      <label>Opening kickoff by</label>
      <div class="kick">
        <button data-kick="home" class="muted">Home</button>
        <button data-kick="away" class="muted">Away</button>
      </div>
      <button class="start" id="startBtn">Start game</button>
      ${saved ? `<button class="resume" id="resumeBtn">Resume saved game</button>` : ''}
      <button class="resume" id="restoreBtn">Load a backup file</button>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden>
    </div>`;
  setupKick = null;
  document.querySelectorAll("[data-kick]").forEach(b =>
    b.onclick = () => { setupKick = b.dataset.kick;
      document.querySelectorAll("[data-kick]").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); });

  wireColorPickers();

  document.getElementById("startBtn").onclick = () => {
    const home = (document.getElementById("home").value || "Home").trim();
    const away = (document.getElementById("away").value || "Away").trim();
    const homeAbbr = E.autoAbbr(home), awayAbbr = E.autoAbbr(away);
    const who = setupKick === "away" ? awayAbbr : homeAbbr;
    const homeColor = colorPick.home, awayColor = colorPick.away;
    startGame({ homeName: home, awayName: away,
      quarterLength: document.getElementById("qlen").value, whoKicksOff: who,
      homeColor, awayColor });
  };
  const rb = document.getElementById("resumeBtn");
  if (rb) rb.onclick = () => { game = load(); if (game) render(); };
  const rf = document.getElementById("restoreFile");
  document.getElementById("restoreBtn").onclick = () => rf.click();
  rf.onchange = () => { if (rf.files[0]) restoreBackup(rf.files[0]); rf.value = ""; };
}

/* ---------- event wiring ---------- */
function wireDraftControls() {
  document.querySelectorAll("[data-complete]").forEach(b =>
    b.onclick = () => setComplete(b.dataset.complete === "yes"));
  document.querySelectorAll("[data-focus]").forEach(b => b.onclick = () => focusField(b.dataset.focus));
  document.querySelectorAll("[data-key]").forEach(b => b.onclick = () => padPress(b.dataset.key));
  document.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => {
    const i = b.dataset.chip.indexOf(":");
    const field = b.dataset.chip.slice(0, i);
    let value = b.dataset.chip.slice(i + 1);
    if (value === "true") value = true;
    else if (value === "false") value = false;
    else if (/^\d+$/.test(value) && (field === "confirmDown" || field === "yards")) value = Number(value);
    setChip(field, value);
  });
  document.querySelectorAll("[data-confirmedit]").forEach(b => b.onclick = () => {
    draft.confirmOpen = b.dataset.confirmedit === "open";
    draft.active = draft.confirmOpen ? "confirmToGo" : null;
    render();
  });
}
function wire() {
  document.querySelectorAll("[data-type]").forEach(b => b.onclick = () => pickType(b.dataset.type));
  wireDraftControls();
  const sb = document.getElementById("saveBtn"); if (sb) sb.onclick = commit;
  const eb = document.getElementById("editBtn"); if (eb) eb.onclick = editLast;
  const lt = document.getElementById("lastTxt"); if (lt) lt.onclick = () => openLog("live");
  const ub = document.getElementById("undoBtn"); if (ub) ub.onclick = undoLast;
  const mb = document.getElementById("menuBtn"); if (mb) mb.onclick = openMenu;
  const ss = document.getElementById("setSpotBtn"); if (ss) ss.onclick = openSetSpot;
}

/* ---------- boot ---------- */
game = load();
render();
</script>
