<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#16201b">
<title>Stat Sheet — live entry</title>
<style>
  :root {
    --bg: #16201b;          /* dark slate-green, legible in a dark stand */
    --panel: #1f2c25;
    --panel-2: #283a31;
    --line: #36493e;
    --chalk: #f2f5f0;       /* primary text */
    --dim: #8aa093;         /* secondary text */
    --turf: #3ddc84;        /* possession + confirm accent */
    --turf-deep: #137a44;
    --flag: #ffd23f;        /* caution / loss */
    --pen: #ff8a5c;         /* conflict / warning */
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--chalk);
    font-family: ui-sans-serif, -apple-system, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    display: flex; justify-content: center;
    overscroll-behavior: none;
  }
  #app { width: 100%; max-width: 430px; display: flex; flex-direction: column;
         height: 100dvh; }

  /* ---------- scoreboard strip ---------- */
  .board { display: flex; align-items: center; justify-content: space-between;
           padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .board .team { display: flex; align-items: center; gap: 7px; }
  .board .abbr { font-weight: 700; letter-spacing: .04em; }
  .board .pts { font-size: 20px; font-weight: 700; }
  .board .has { color: var(--turf); }
  .board .meta { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .menubtn { background: none; border: none; color: var(--dim); font-size: 20px; line-height: 1;
             padding: 2px 6px; cursor: pointer; border-radius: 8px; }
  .menubtn:active { background: var(--panel-2); }
  .setspot { margin-top: 14px; background: var(--panel-2); border: 1px solid var(--turf-deep);
             color: var(--turf); height: 44px; padding: 0 18px; font-size: 14px; font-weight: 600;
             border-radius: 12px; cursor: pointer; }
  /* slide-up menu sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex;
              align-items: flex-end; justify-content: center; z-index: 50; }
  .sheet { width: 100%; max-width: 430px; background: var(--panel); border-top-left-radius: 18px;
           border-top-right-radius: 18px; padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h3 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em;
              margin: 8px 4px 12px; font-weight: 600; }
  .sheet button { width: 100%; height: 52px; font-size: 16px; margin-bottom: 8px; text-align: left;
                  padding: 0 16px; }
  .sheet .danger { color: var(--pen); border-color: var(--pen); }
  .sheet .cancel { background: none; color: var(--dim); text-align: center; }
  .sheet .ss-fields { display: flex; gap: 8px; margin-bottom: 10px; }
  .sheet .ss-fields > * { flex: 1; }
  .sheet select, .sheet .numin { height: 48px; background: var(--panel-2); color: var(--chalk);
            border: 1px solid var(--line); border-radius: 10px; font-size: 16px; font-family: inherit;
            text-align: center; width: 100%; padding: 0 8px; }
  .poss-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--turf); display: inline-block; }
  .colorbars { display: flex; height: 4px; }
  .colorbars .cbar { flex: 1; transition: opacity .2s ease; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }

  /* ---------- situation bar ---------- */
  .sit { padding: 18px 16px 14px; text-align: center; border-bottom: 1px solid var(--line); }
  .sit .dd { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  .sit .spot { font-size: 14px; color: var(--dim); margin-top: 3px; }
  .sit .spot b { color: var(--chalk); font-weight: 600; }

  /* ---------- body scroll area ---------- */
  .scroll { flex: 1; overflow-y: auto; padding: 14px 16px 8px; overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch; }
  /* phones: no double-tap zoom on fast repeated digits, no tap flash, no text-select on long press */
  button, .val, [data-focus], [data-key], [data-chip] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .pad, .types, .chiprow, .fields { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  /* ---------- play type buttons ---------- */
  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .types .big { height: 64px; font-size: 20px; font-weight: 700; }
  .types .promo { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .types .promo button { height: 52px; font-size: 16px; font-weight: 700;
      border-color: var(--flag); color: var(--flag); }
  .types .promo button.sel { background: var(--flag); color: #2a2400; }
  .types .row2 { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
  .types .row2 button { height: 40px; font-size: 12px; }
  .grouplabel { display: block; font-size: 11px; color: var(--dim); margin: 10px 0 6px; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { height: 40px; padding: 0 13px; font-size: 13px; font-weight: 600; border-radius: 10px; }
  .confirmbox { margin-top: 12px; padding: 10px 12px 4px; border: 1px dashed var(--turf-deep);
      border-radius: 12px; }
  .confirmbox .grouplabel:first-child { margin-top: 0; color: var(--turf); }
  /* play log */
  .loghead { padding: 10px 16px 6px; font-size: 12px; color: var(--dim);
             background: var(--panel); border-top: 1px solid var(--line); }
  .loghead b { color: var(--chalk); }
  .logrow { padding: 8px 16px; font-size: 13px; color: var(--dim);
            border-bottom: 1px solid var(--line); cursor: pointer; }
  .logrow:active { background: var(--panel-2); }
  .logrow.sub { padding-left: 32px; font-size: 12px; }
  .logrow.boxed { border: 2px solid var(--turf-deep); border-radius: 10px; margin: 4px 10px;
                  color: var(--chalk); background: var(--panel); }
  .logqtr { text-align: center; font-size: 12px; color: var(--dim); padding: 10px 0;
            letter-spacing: .04em; }
  .delplay { width: 100%; height: 46px; margin-top: 14px; background: none;
             border: 1px solid var(--pen); color: var(--pen); border-radius: var(--radius);
             font-size: 14px; }
  .cascade { font-size: 13px; color: var(--chalk); padding: 7px 4px; border-bottom: 1px solid var(--line); }
  .cascade.conflict { color: var(--pen); font-weight: 600; }
  .cascade .held { color: var(--turf); font-weight: 600; font-size: 12px; }
  button {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--chalk);
    border-radius: var(--radius); font-family: inherit; cursor: pointer;
    transition: transform .04s ease, background .12s ease;
  }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 2px solid var(--turf); outline-offset: 2px; }
  button.sel { background: var(--turf); color: #06241a; border-color: var(--turf); }
  button.muted { background: var(--panel); color: var(--dim); }

  /* ---------- entry panel ---------- */
  .panel { margin-top: 14px; background: var(--panel); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 14px; }
  .panel.hidden { display: none; }
  .panel h3 { margin: 0 0 12px; font-size: 13px; color: var(--dim); font-weight: 600;
              text-transform: uppercase; letter-spacing: .06em; }

  .passtoggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .passtoggle button { height: 48px; font-size: 15px; font-weight: 600; }

  .fields { display: flex; gap: 10px; margin-bottom: 12px; }
  .field { flex: 1; }
  .field label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 5px; }
  .field label .req { color: var(--turf); }
  .field .val {
    height: 52px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel-2); display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; cursor: pointer; user-select: none;
  }
  .field .val.active { border-color: var(--turf); box-shadow: 0 0 0 1px var(--turf); }
  .field .val.empty { color: var(--dim); font-weight: 500; }

  /* ---------- number pad ---------- */
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .pad button { height: 50px; font-size: 22px; font-weight: 600; }
  .pad .sign { color: var(--flag); font-weight: 700; }
  .pad .sign.neg { background: var(--flag); color: #2a2400; border-color: var(--flag); }
  .pad .clr { font-size: 15px; color: var(--dim); }

  /* ---------- save ---------- */
  .save { width: 100%; height: 58px; font-size: 16px; font-weight: 700;
          background: var(--turf); color: #06241a; border: none; border-radius: var(--radius);
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  .save:disabled { background: var(--panel-2); color: var(--dim); }
  .save .preview { font-size: 12px; font-weight: 600; opacity: .8; }

  /* ---------- last play strip ---------- */
  .last { border-top: 1px solid var(--line); padding: 12px 16px;
          display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .last .txt { font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .last .txt b { color: var(--chalk); font-weight: 600; }
  .last .edit { flex: 0 0 auto; background: none; border: 1px solid var(--line);
                color: var(--dim); height: 34px; padding: 0 12px; font-size: 12px; border-radius: 9px; }
  .last.empty .txt { font-style: italic; }

  /* ---------- setup screen ---------- */
  .setup { padding: 28px 20px; }
  .setup h1 { font-size: 22px; margin: 0 0 4px; }
  .setup p { color: var(--dim); font-size: 13px; margin: 0 0 22px; }
  .setup label { display: block; font-size: 12px; color: var(--dim); margin: 14px 0 5px; }
  .setup input, .setup select {
    width: 100%; height: 48px; padding: 0 12px; font-size: 16px; font-family: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--chalk);
  }
  .setup .kick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 2px; margin: 2px 0 10px; }
  .sheet .swatches button.sw, .swatches .sw { height: auto; width: auto; margin: 0; padding: 4px 0 2px;
         background: none; border: none; border-radius: 10px; display: flex; flex-direction: column;
         align-items: center; gap: 4px; text-align: center; font-size: 10px; }
  .swatches .dot { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.28);
                   box-shadow: 0 0 0 2px transparent; transition: box-shadow .12s ease; }
  .swatches .nm { color: var(--dim); font-size: 10px; line-height: 1.1; white-space: nowrap; }
  .swatches .sw.sel .dot { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--chalk); }
  .swatches .sw.sel .nm { color: var(--chalk); font-weight: 700; }
  .sheet { max-height: 92dvh; overflow-y: auto; }
  .setup .swatch { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--line);
                   flex: 0 0 auto; background: var(--panel-2); }
  .setup .kick button { height: 48px; font-weight: 600; }
  .setup .start { margin-top: 26px; width: 100%; height: 56px; font-size: 17px; font-weight: 700;
                  background: var(--turf); color: #06241a; border: none; border-radius: var(--radius); }
  .resume { margin-top: 14px; width: 100%; height: 46px; background: var(--panel); color: var(--dim);
            border: 1px solid var(--line); border-radius: 12px; font-size: 13px; }

  /* ---------- Phase 5: stats ---------- */
  .stats { padding-bottom: 24px; }
  .st-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 4px 2px; }
  .st-team { display: flex; align-items: baseline; gap: 10px; }
  .st-team:last-child { justify-content: flex-end; }
  .st-team .abbr { font-size: 15px; font-weight: 700; letter-spacing: .04em; }
  .st-team .pts { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .st-status { font-size: 12px; color: var(--dim); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; }
  .linescore { width: 100%; border-collapse: collapse; margin: 12px 0 2px; font-size: 13px; }
  .linescore th, .linescore td { text-align: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .linescore tr:first-child th { color: var(--dim); font-weight: 500; font-size: 11px; }
  .linescore th:first-child { text-align: left; width: 22%; font-weight: 700; }
  .linescore td { color: var(--dim); }
  .linescore .tot { color: var(--chalk); font-weight: 700; }
  .st-panel h3 { margin-bottom: 6px; }
  .cmp { display: grid; grid-template-columns: 1fr 1.3fr 1fr; align-items: center; padding: 8px 0;
         border-bottom: 1px solid var(--line); }
  .cmp:last-child { border-bottom: none; }
  .cmp .l { text-align: left; font-size: 17px; font-weight: 700; }
  .cmp .r { text-align: right; font-size: 17px; font-weight: 700; }
  .cmp .m { text-align: center; font-size: 12px; color: var(--dim); line-height: 1.25; }
  .cmp .m small { display: block; font-size: 10px; opacity: .75; }
  .cmp.head { padding: 2px 0 6px; }
  .cmp.head .l, .cmp.head .r { font-size: 12px; letter-spacing: .04em; }
  .ldr { padding: 6px 0 4px; }
  .ldr-cat { font-size: 11px; color: var(--dim); margin-bottom: 5px; }
  .ldr-cells { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ldr-cell { border-left: 3px solid; padding: 3px 0 3px 9px; font-size: 12px; color: var(--dim); line-height: 1.35; }
  .ldr-cell b { display: block; font-size: 16px; color: var(--chalk); }
  .ldr-cell.empty { font-size: 16px; }
  .scr { display: grid; grid-template-columns: 44px 36px 1fr auto; gap: 6px; align-items: baseline;
         padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; }
  .scr:last-child { border-bottom: none; }
  .scr .q { color: var(--dim); font-size: 11px; }
  .scr .who { font-weight: 700; font-size: 12px; }
  .scr .sc { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .st-empty { color: var(--dim); font-size: 13px; padding: 6px 0; }
  .st-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 10px; }
  .st-actions button { min-height: 46px; font-size: 13px; font-weight: 600; padding: 6px 8px; }
  .bx-tabs { margin: 0 0 4px; }
  .bx-tabs .chip { flex: 1; }
  .bx-sum { font-size: 13px; color: var(--dim); line-height: 1.6; padding: 4px 2px 0; }
  .bx-sum b { color: var(--chalk); }
  .bxwrap { overflow-x: auto; }
  .bx { width: 100%; border-collapse: collapse; font-size: 14px; }
  .bx th, .bx td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  .bx th { text-align: left; font-weight: 700; }
  .bx tr:first-child td { color: var(--dim); font-size: 11px; font-weight: 500; }
  .bx tr:last-child th, .bx tr:last-child td { border-bottom: none; }
  .bx tr.nonum th, .bx tr.nonum td { color: var(--flag); font-style: italic; cursor: pointer; }
  .bx tr.total th, .bx tr.total td { color: var(--dim); font-weight: 600; border-top: 1px solid var(--dim); }
  .st-note { font-size: 12px; color: var(--dim); margin-top: 12px; line-height: 1.45; }
  .exporttext { max-height: 38vh; overflow: auto; background: var(--bg); border: 1px solid var(--line);
                border-radius: 10px; padding: 10px; font-size: 12px; line-height: 1.45; white-space: pre-wrap;
                color: var(--chalk); margin: 0 0 10px; user-select: text; -webkit-user-select: text; }
  /* game clock + timeouts */
  .abbr-col { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
  .tos { display: inline-flex; gap: 4px; }
  .tos i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #FFC72C; opacity: .45; }
  .tos i.on { background: #FFC72C; opacity: 1; }
  .clockrow { align-items: flex-end; }
  .clockhint { flex: 1; font-size: 12px; color: var(--dim); padding-bottom: 12px; line-height: 1.3; }
  .val.bad { color: var(--flag); border-color: var(--flag); }
  .scr .tm { color: var(--chalk); font-size: 11px; white-space: nowrap; }
  .scr .tm.missing { color: var(--flag); font-weight: 600; }
  .scr.to .what { color: var(--dim); }
  /* game end + email */
  .final-panel { border-color: var(--turf); }
  .emailin { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
             color: var(--chalk); font-size: 16px; padding: 0 14px; margin: 0 0 10px; }
  .emailnote { font-size: 12px; color: var(--dim); line-height: 1.45; margin: 2px 0 6px; }
  .sharegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .exportwrap summary { font-size: 13px; color: var(--dim); padding: 10px 2px; cursor: pointer; }
  .final-panel button { width: 100%; min-height: 50px; border-radius: 12px; margin-bottom: 8px; font-size: 15px;
                        font-weight: 600; background: var(--panel-2); color: var(--chalk); border: 1px solid var(--line); }
  .final-panel button.sel { background: var(--turf); color: #06241a; border-color: var(--turf); }
  .pad .nextkey { font-size: 15px; font-weight: 700; color: var(--turf); }
  .confirmline { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px;
                 margin-top: 10px; padding: 0 4px 0 12px; border: 1px dashed var(--turf-deep); border-radius: 12px;
                 font-size: 14px; color: var(--chalk); }
  .confirmline .dim { color: var(--dim); font-size: 12px; }
  .confirmline button, .confirmdone { background: none; border: none; color: var(--turf); font-weight: 700;
                 font-size: 14px; padding: 10px 10px; }
  .confirmdone { display: block; margin: 4px 0 6px auto; }
  .penyds .chip { flex: 1; font-size: 17px; font-weight: 700; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   FOOTBALL STATS ENGINE — Phase 1
   Pure game logic. No DOM, no storage, no UI.

   Core architecture:
   - A game is { config, plays[] }. Nothing else is stored.
   - State is ALWAYS derived by replaying plays from the start
     (reduceGame). Live entry = append play + replay.
     Corrections = edit play + replay. Stats (Phase 5) will be
     another fold over the same log.
   - Field position: absolute 1-99, always in the possessing
     team's frame. Possession flip = 100 - pos.
   - Anchored plays (penalty confirms, turnover spots, muffed
     punts) set position from user input, not math — so any
     correction cascade naturally stops at the next anchor.
   ============================================================ */

const FootballEngine = (() => {

  const TOUCHBACK_SPOT = 20;        // NFHS free kick & punt touchback
  const KICKOFF_DEFAULT = 40;       // kickoff spot, editable per kick
  const FREE_KICK_DEFAULT = 20;     // free kick after safety
  const KICK_OOB_SPOT = 35;         // kickoff out of bounds, overrideable

  /* ---------- helpers ---------- */

  const flip = (pos) => 100 - pos;

  function autoAbbr(name) {
    return (name || "TEAM").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase() || "TM";
  }

  function ordinal(n) {
    return n === 1 ? "1st" : n === 2 ? "2nd" : n === 3 ? "3rd" : n + "th";
  }

  function clamp(pos) {
    return Math.max(0, Math.min(100, pos));
  }

  /* Display translation: the ONLY place 1-99 becomes human.
     pos < 50 -> possessing team's side, descending past midfield. */
  function displayYardLine(pos, possessionAbbr, config) {
    const opp = otherTeam(possessionAbbr, config);
    if (pos <= 0) return possessionAbbr + " goal line";
    if (pos >= 100) return opp + " goal line";
    if (pos < 50) return possessionAbbr + " " + pos;
    if (pos === 50) return "50";
    return opp + " " + (100 - pos);
  }

  function otherTeam(abbr, config) {
    return abbr === config.homeTeam.abbr ? config.awayTeam.abbr : config.homeTeam.abbr;
  }

  function toGo(state) {
    const target = state.goalToGo ? 100 : state.firstDownAt;
    return target - state.ballOn;
  }

  function situationText(state, config) {
    if (state.phase === "TRY") return "Try (" + state.possession + ")";
    if (state.phase === "KICKOFF") return "Kickoff — " + state.possession + " kicking";
    if (state.phase === "FREE_KICK") return "Free kick — " + state.possession + " kicking";
    return ordinal(state.down) + " & " + (state.goalToGo ? "goal" : toGo(state)) +
      " \u00B7 " + displayYardLine(state.ballOn, state.possession, config);
  }

  /* ---------- game creation ---------- */

  function createGame(cfg) {
    const home = { name: cfg.homeName, abbr: cfg.homeAbbr || autoAbbr(cfg.homeName), color: cfg.homeColor || null };
    const away = { name: cfg.awayName, abbr: cfg.awayAbbr || autoAbbr(cfg.awayName), color: cfg.awayColor || null };
    if (home.abbr === away.abbr) away.abbr = away.abbr.slice(0, 2) + "2";
    return {
      config: {
        homeTeam: home,
        awayTeam: away,
        date: cfg.date || null,
        quarterLength: cfg.quarterLength || "12:00",
        whoKicksOff: cfg.whoKicksOff || home.abbr
      },
      plays: [],
      nextId: 1
    };
  }

  /* ---------- the reducer: plays -> state ---------- */

  function initialState(config) {
    const score = {};
    score[config.homeTeam.abbr] = 0;
    score[config.awayTeam.abbr] = 0;
    return {
      quarter: 1,
      phase: "KICKOFF",              // KICKOFF | PLAY | TRY | FREE_KICK
      possession: config.whoKicksOff, // during KICKOFF/FREE_KICK = kicking team
      down: 1,
      firstDownAt: 0,
      goalToGo: false,
      ballOn: 0,
      score: score,
      kickDefault: KICKOFF_DEFAULT
    };
  }

  function firstDown(state, at) {
    state.down = 1;
    state.ballOn = at;
    if (at + 10 >= 100) {
      state.goalToGo = true;
      state.firstDownAt = 100;
    } else {
      state.goalToGo = false;
      state.firstDownAt = at + 10;
    }
  }

  function changePossession(state, config, at) {
    state.possession = otherTeam(state.possession, config);
    state.phase = "PLAY";
    firstDown(state, at);
  }

  function awardTouchdown(state, config, scoringTeam, events) {
    state.score[scoringTeam] += 6;
    state.phase = "TRY";
    state.possession = scoringTeam;
    state.ballOn = 100;
    events.push("TOUCHDOWN");
  }

  function awardSafety(state, config, events) {
    const defense = otherTeam(state.possession, config);
    state.score[defense] += 2;
    state.phase = "FREE_KICK";       // offense free kicks from their 20
    state.kickDefault = FREE_KICK_DEFAULT;
    state.ballOn = 0;
    events.push("SAFETY");
  }

  /* Standard down progression after an offensive play ending at `after`. */
  function progressDowns(state, config, after, events, conflicts, play) {
    const recordedTD = play.input.result === "TOUCHDOWN";
    const mathTD = after >= 100;
    const mathSafety = after <= 0;

    if (recordedTD && !mathTD) {
      conflicts.push({
        playId: play.id,
        type: "TD_NOT_REACHED",
        message: "Recorded touchdown, but recalculated spot is " +
          displayYardLine(after, state.possession, config)
      });
    }
    if (!recordedTD && mathTD && play.input.result !== "SAFETY") {
      conflicts.push({
        playId: play.id,
        type: "TD_NOT_RECORDED",
        message: "Recalculated position reaches the goal line but play is not marked touchdown"
      });
    }

    if (recordedTD || mathTD) {                 // trust recorded result for replay
      awardTouchdown(state, config, state.possession, events);
      return;
    }
    if (mathSafety || play.input.result === "SAFETY") {
      awardSafety(state, config, events);
      return;
    }

    const target = state.goalToGo ? 100 : state.firstDownAt;
    if (after >= target) {
      firstDown(state, after);
      events.push("FIRST_DOWN");
      return;
    }
    state.ballOn = after;
    if (state.down >= 4) {
      events.push("TURNOVER_ON_DOWNS");
      changePossession(state, config, clamp(flip(after)));
    } else {
      state.down += 1;
    }
  }

  /* ---------- per-play handlers ----------
     Each receives (state, config, play, events, conflicts),
     mutates state, and may set play.anchored. */

  const handlers = {

    KICKOFF(state, config, play, events) {
      const inp = play.input;
      const kicking = state.possession;
      const kickFrom = inp.kickFrom != null ? inp.kickFrom : state.kickDefault;
      state.kickDefault = KICKOFF_DEFAULT;
      const landing = clamp(kickFrom + (inp.distance || 0));

      switch (inp.result) {
        case "TOUCHBACK":
          changePossession(state, config, TOUCHBACK_SPOT); break;
        case "ONSIDE_RECOVERED":
          state.phase = "PLAY";
          firstDown(state, landing);
          events.push("ONSIDE_RECOVERED");
          break;
        case "ONSIDE_LOST":
          changePossession(state, config, clamp(flip(landing))); break;
        case "OUT_OF_BOUNDS":
          play.anchored = inp.finalSpot != null;
          changePossession(state, config, inp.finalSpot != null ? inp.finalSpot : KICK_OOB_SPOT);
          break;
        case "TOUCHDOWN": {
          const receiver = otherTeam(kicking, config);
          awardTouchdown(state, config, receiver, events);
          break;
        }
        default: { // RETURNED
          const after = clamp(flip(landing) + (inp.returnYards || 0));
          if (after >= 100) {
            awardTouchdown(state, config, otherTeam(kicking, config), events);
          } else {
            changePossession(state, config, after);
          }
        }
      }
    },

    RUN(state, config, play, events, conflicts) {
      const after = clamp(state.ballOn + (play.input.yards || 0));
      progressDowns(state, config, after, events, conflicts, play);
    },

    PASS(state, config, play, events, conflicts) {
      if (!play.input.complete) {
        progressDowns(state, config, state.ballOn, events, conflicts, play);
        return;
      }
      const after = clamp(state.ballOn + (play.input.yards || 0));
      progressDowns(state, config, after, events, conflicts, play);
    },

    KNEEL(state, config, play, events, conflicts) {
      progressDowns(state, config, state.ballOn, events, conflicts, play);
    },

    PUNT(state, config, play, events) {
      const inp = play.input;
      const landing = state.ballOn + (inp.distance || 0);
      switch (inp.result) {
        case "TOUCHBACK":
          changePossession(state, config, TOUCHBACK_SPOT); break;
        case "FAIR_CATCH":
        case "DOWNED":
        case "OUT_OF_BOUNDS":
          changePossession(state, config, clamp(flip(clamp(landing)))); break;
        case "MUFFED":
          play.anchored = true;
          if (inp.recoveredByTeam === state.possession) {
            state.phase = "PLAY";
            firstDown(state, inp.finalSpot);
          } else {
            changePossession(state, config, inp.finalSpot);
          }
          break;
        case "TOUCHDOWN":
          awardTouchdown(state, config, otherTeam(state.possession, config), events);
          break;
        default: { // RETURNED
          if (landing >= 100) { changePossession(state, config, TOUCHBACK_SPOT); break; }
          const after = clamp(flip(landing) + (inp.returnYards || 0));
          if (after >= 100) awardTouchdown(state, config, otherTeam(state.possession, config), events);
          else changePossession(state, config, after);
        }
      }
    },

    TURNOVER(state, config, play, events) {
      const inp = play.input;             // finalSpot is in the NEW team's frame
      play.anchored = true;
      if (inp.result === "TOUCHDOWN") {
        awardTouchdown(state, config, otherTeam(state.possession, config), events);
      } else if (inp.result === "TOUCHBACK") {
        changePossession(state, config, TOUCHBACK_SPOT);
      } else {
        changePossession(state, config, inp.finalSpot);
      }
      events.push(inp.turnoverType === "INTERCEPTION" ? "INTERCEPTION" : "FUMBLE_LOST");
    },

    PENALTY(state, config, play, events) {
      const inp = play.input;
      if (inp.accepted && inp.confirm) {  // user confirms the resulting situation
        play.anchored = true;
        state.down = inp.confirm.down;
        state.ballOn = inp.confirm.ballOn;
        const target = inp.confirm.ballOn + inp.confirm.toGo;
        if (target >= 100) { state.goalToGo = true; state.firstDownAt = 100; }
        else { state.goalToGo = false; state.firstDownAt = target; }
        events.push("PENALTY_" + inp.team);
      }
    },

    FIELD_GOAL(state, config, play, events) {
      const inp = play.input;
      if (inp.result === "GOOD") {
        state.score[state.possession] += 3;
        state.phase = "KICKOFF";
        state.kickDefault = KICKOFF_DEFAULT;
        events.push("FIELD_GOAL_GOOD");
      } else {
        const spot = inp.finalSpot != null ? inp.finalSpot : clamp(flip(state.ballOn));
        if (inp.finalSpot != null) play.anchored = true;
        changePossession(state, config, spot);
        events.push("FIELD_GOAL_MISSED");
      }
    },

    TRY(state, config, play, events, conflicts) {
      if (state.phase !== "TRY") {
        // A try with no touchdown before it (the TD was edited away or deleted).
        // Don't score it; surface it for the user to delete or repair.
        conflicts.push({ playId: play.id, type: "ORPHANED_TRY",
          message: "Try recorded but no touchdown precedes it — delete this try or restore the score" });
        return;
      }
      const inp = play.input;
      const scoring = state.possession;
      if (inp.result === "GOOD") {
        state.score[scoring] += (inp.tryType === "KICK" ? 1 : 2);
        events.push("TRY_GOOD");
      } else if (inp.result === "DEFENSIVE_2PT") {
        state.score[otherTeam(scoring, config)] += 2;
        events.push("DEFENSIVE_2PT");
      } else {
        events.push("TRY_NO_GOOD");
      }
      state.phase = "KICKOFF";          // scoring team kicks off
      state.kickDefault = KICKOFF_DEFAULT;
    },

    TIMEOUT() { /* recorded, no state change */ },

    SET_SPOT(state, config, play, events) {
      // Direct game-state set. An anchor: spot comes from the user, not math,
      // so correction cascades stop here. Used to start tracking mid-drive
      // or to recover from a state a phase can't yet enter.
      const inp = play.input;
      play.anchored = true;
      state.phase = "PLAY";
      if (inp.possession) state.possession = inp.possession;
      const at = inp.ballOn != null ? inp.ballOn : state.ballOn;
      state.down = inp.down || 1;
      if (inp.toGo != null) {
        const target = at + inp.toGo;
        if (target >= 100) { state.goalToGo = true; state.firstDownAt = 100; }
        else { state.goalToGo = false; state.firstDownAt = target; }
        state.ballOn = at;
      } else {
        firstDown(state, at);          // default: fresh 1st & 10 from the spot
        state.down = inp.down || 1;
      }
      events.push("SET_SPOT");
    },

    QUARTER_END(state, config, play, events) {
      const ending = state.quarter;
      state.quarter = state.quarter === 4 ? "OT" :
        (typeof state.quarter === "number" ? state.quarter + 1 : "OT");
      events.push("QUARTER_" + state.quarter);
      // Halftime: the second half opens with a kickoff no matter where the
      // first half ended (mid-drive, or right after a score's try/kickoff
      // phase). Only plays recorded with halftimeKicker do this, so games
      // saved before this rule replay exactly as they did.
      const kicker = play.input && play.input.halftimeKicker;
      if (ending === 2 && kicker) {
        state.phase = "KICKOFF";
        state.possession = kicker;
        state.kickDefault = KICKOFF_DEFAULT;
        state.ballOn = 0;
        state.down = 1;
        events.push("HALFTIME");
      }
    }
  };

  /* ---------- replay ---------- */

  function reduceGame(game) {
    const state = initialState(game.config);
    const snapshots = [];
    const conflicts = [];
    const allEvents = [];

    for (const play of game.plays) {
      const before = {
        ballOnBefore: state.ballOn,
        possession: state.possession,
        phase: state.phase,
        down: state.down,
        toGo: state.phase === "PLAY" ? toGo(state) : null,
        quarter: state.quarter
      };
      const events = [];
      const h = handlers[play.type];
      if (!h) throw new Error("Unknown play type: " + play.type);
      h(state, game.config, play, events, conflicts);

      const snap = Object.assign({}, before, {
        playId: play.id,
        ballOnAfter: state.ballOn,
        possessionAfter: state.possession,
        events: events
      });
      play.computed = snap;            // attached for log display & corrections
      snapshots.push(snap);
      allEvents.push(events);
    }
    return { state, snapshots, conflicts };
  }

  /* ---------- public ops ---------- */

  function applyPlay(game, type, input, opts) {
    const play = {
      id: game.nextId++,
      timestamp: (opts && opts.timestamp) || Date.now(),
      gameClock: input.gameClock || null,
      type: type,
      input: input,
      anchored: false,
      notes: input.notes || null,
      editHistory: []
    };
    game.plays.push(play);
    const result = reduceGame(game);

    // freeze auto-detected results into the record so replay trusts them
    const lastEvents = play.computed.events;
    if (lastEvents.includes("TOUCHDOWN") && !play.input.result) play.input.result = "TOUCHDOWN";
    if (lastEvents.includes("SAFETY") && !play.input.result) play.input.result = "SAFETY";

    return { play, state: result.state, events: lastEvents, conflicts: result.conflicts };
  }

  function getState(game) {
    return reduceGame(game).state;
  }

  /* Preview a historical edit: returns the per-play diff and any
     conflicts, WITHOUT committing. Cascade is naturally bounded by
     the next anchored play. */
  function previewEdit(game, playId, newInput) {
    const before = reduceGame(game).snapshots;
    const target = game.plays.find(p => p.id === playId);
    if (!target) throw new Error("No play with id " + playId);

    const saved = target.input;
    target.input = Object.assign({}, saved, newInput);
    const after = reduceGame(game);
    target.input = saved;             // restore
    reduceGame(game);                 // restore computed snapshots

    const changes = [];
    for (let i = 0; i < before.length; i++) {
      const a = before[i], b = after.snapshots[i];
      if (a.ballOnBefore !== b.ballOnBefore || a.ballOnAfter !== b.ballOnAfter ||
          a.down !== b.down || a.toGo !== b.toGo || a.possession !== b.possession) {
        // anchorHeld: entering situation shifted but the play's confirmed
        // output is unchanged — this play terminates the cascade.
        const anchorHeld = a.ballOnAfter === b.ballOnAfter &&
          a.possessionAfter === b.possessionAfter && a.ballOnBefore !== b.ballOnBefore;
        changes.push({ playId: a.playId, before: a, after: b, anchorHeld });
      }
    }
    return { changes, conflicts: after.conflicts, newState: after.state };
  }

  function commitEdit(game, playId, newInput) {
    const target = game.plays.find(p => p.id === playId);
    if (!target) throw new Error("No play with id " + playId);
    target.editHistory.push({ at: Date.now(), before: Object.assign({}, target.input) });
    target.input = Object.assign({}, target.input, newInput);
    return reduceGame(game);
  }

  function endQuarter(game, input) {
    return applyPlay(game, "QUARTER_END", input || {});
  }

  return {
    createGame, applyPlay, getState, reduceGame,
    previewEdit, commitEdit, endQuarter,
    displayYardLine, situationText, toGo, flip, autoAbbr, otherTeam,
    TOUCHBACK_SPOT, KICKOFF_DEFAULT, FREE_KICK_DEFAULT
  };
})();

/* ============================================================
   FOOTBALL STATS — Phase 5
   One more fold over the play log. Nothing here is stored:
   every call replays the game first, so a correction anywhere
   in the log shows up in these numbers immediately.

   Conventions (NFHS / agreed spec):
   - Sacks and scrambles are RUN plays, so they count in rushing.
   - Kneels: 0 yards, not a rushing attempt, not a play.
   - An interception (TURNOVER/INTERCEPTION) is a pass attempt
     charged to the passer (thrownBy).
   - A lost fumble counts as an offensive play for 0 yards.
   - Try yardage is not counted; tries show as PAT / 2-pt.
   - A play with no jersey number lands in the "unattributed"
     row (player: null) of its table.
   ============================================================ */
const FootballStats = (() => {
  const E = FootballEngine;

  const TEMPLATES = {
    rushing:     { att:0, yds:0, td:0, long:null },
    passing:     { comp:0, att:0, int:0, yds:0, td:0, long:null },
    receiving:   { rec:0, yds:0, td:0, long:null },
    kicking:     { fgm:0, fga:0, fgLong:null, patm:0, pata:0, ko:0, koTB:0 },
    punting:     { no:0, yds:0, long:null },
    kickReturns: { no:0, yds:0, td:0, long:null },
    puntReturns: { no:0, yds:0, td:0, long:null },
    defense:     { int:0, intYds:0, fr:0, td:0 }
  };
  const TABLES = Object.keys(TEMPLATES);

  function blankTeam(team, side) {
    const t = { abbr: team.abbr, name: team.name, side,
      totals: { points:0, firstDowns:0, fdRush:0, fdPass:0, fdPen:0,
                rushAtt:0, rushYds:0, passComp:0, passAtt:0, passInt:0, passYds:0,
                plays:0, totalYds:0, ypp:null, fumblesLost:0, turnovers:0,
                penalties:0, penYds:0, thirdConv:0, thirdAtt:0, fourthConv:0, fourthAtt:0,
                twoPtMade:0, twoPtAtt:0 } };
    TABLES.forEach(k => t[k] = {});
    return t;
  }

  const hasNum = n => n !== null && n !== undefined && n !== "";
  function row(team, table, num) {
    const key = hasNum(num) ? "n" + num : "none";
    if (!team[table][key])
      team[table][key] = Object.assign({ player: hasNum(num) ? Number(num) : null }, TEMPLATES[table]);
    return team[table][key];
  }
  const longest = (cur, v) => (cur === null || v > cur) ? v : cur;
  const tag = n => hasNum(n) ? "#" + n + " " : "";

  /* sort numbered players by the table's main number; "no #" always last */
  const SORT = { rushing:"yds", passing:"att", receiving:"yds", kicking:"fga", punting:"no",
                 kickReturns:"yds", puntReturns:"yds", defense:"int" };
  function finalizeTable(obj, key) {
    const rows = Object.values(obj);
    const named = rows.filter(r => r.player !== null)
      .sort((a, b) => (b[key] - a[key]) || (a.player - b.player));
    const none = rows.filter(r => r.player === null);
    return named.concat(none);
  }

  function aggregate(game) {
    const { state } = E.reduceGame(game);      // always fresh
    const c = game.config;
    const H = c.homeTeam.abbr, A = c.awayTeam.abbr;
    const teams = {};
    teams[H] = blankTeam(c.homeTeam, "home");
    teams[A] = blankTeam(c.awayTeam, "away");
    const other = ab => ab === H ? A : H;

    const line = {}; line[H] = [0,0,0,0,0]; line[A] = [0,0,0,0,0];
    const running = {}; running[H] = 0; running[A] = 0;
    const scoring = [];
    const timeouts = [];
    let openTD = null;                        // TD entry waiting for its try

    function points(team, pts, quarter) {
      running[team] += pts;
      teams[team].totals.points += pts;
      line[team][typeof quarter === "number" ? Math.min(quarter, 4) - 1 : 4] += pts;
    }
    function score(team, pts, quarter, text, play) {
      points(team, pts, quarter);
      const e = { quarter, team, text, playId: play.id, home: running[H], away: running[A],
                  clock: play.input && play.input.clock != null ? play.input.clock : null };
      scoring.push(e);
      return e;
    }
    function downs(T, cm, converted) {
      if (cm.phase !== "PLAY") return;
      if (cm.down === 3) { T.totals.thirdAtt++; if (converted) T.totals.thirdConv++; }
      if (cm.down === 4) { T.totals.fourthAtt++; if (converted) T.totals.fourthConv++; }
    }

    for (const p of game.plays) {
      const cm = p.computed || {}, inp = p.input || {}, ev = cm.events || [];
      const off = cm.possession, def = other(off);
      const T = teams[off], D = teams[def];
      if (!T || !D) continue;
      const q = cm.quarter;
      const td = ev.includes("TOUCHDOWN");
      const tdTeam = cm.possessionAfter;        // engine hands the ball to the scorer
      const fd = ev.includes("FIRST_DOWN");

      switch (p.type) {
        case "RUN": {
          const y = inp.yards || 0;
          const r = row(T, "rushing", inp.runner);
          r.att++; r.yds += y; r.long = longest(r.long, y);
          T.totals.rushAtt++; T.totals.rushYds += y; T.totals.plays++;
          if (fd) T.totals.fdRush++;
          downs(T, cm, fd || td);
          if (td) { r.td++; openTD = score(tdTeam, 6, q, `${tag(inp.runner)}${y}-yd run`, p); }
          break;
        }
        case "PASS": {
          const r = row(T, "passing", inp.passer);
          r.att++; T.totals.passAtt++; T.totals.plays++;
          if (inp.complete) {
            const y = inp.yards || 0;
            const rc = row(T, "receiving", inp.receiver);
            r.comp++; r.yds += y; r.long = longest(r.long, y);
            rc.rec++; rc.yds += y; rc.long = longest(rc.long, y);
            T.totals.passComp++; T.totals.passYds += y;
            if (td) {
              r.td++; rc.td++;
              const from = hasNum(inp.passer) ? ` from #${inp.passer}` : "";
              openTD = score(tdTeam, 6, q, `${tag(inp.receiver)}${y}-yd pass${from}`, p);
            }
          }
          if (fd) T.totals.fdPass++;
          downs(T, cm, fd || td);
          break;
        }
        case "TURNOVER": {
          const ret = inp.returnYards || 0;
          const dr = row(D, "defense", inp.recoveredBy);
          T.totals.plays++; T.totals.turnovers++;
          downs(T, cm, false);
          let kind;
          if (inp.turnoverType === "INTERCEPTION") {
            const r = row(T, "passing", inp.thrownBy);
            r.att++; r.int++;
            T.totals.passAtt++; T.totals.passInt++;
            dr.int++; dr.intYds += ret;
            kind = "interception";
          } else {
            T.totals.fumblesLost++;
            dr.fr++;
            kind = "fumble";
          }
          if (td) { dr.td++; openTD = score(tdTeam, 6, q, `${tag(inp.recoveredBy)}${ret}-yd ${kind} return`, p); }
          break;
        }
        case "KICKOFF": {
          const k = row(T, "kicking", inp.kicker);
          k.ko++;
          if (inp.result === "TOUCHBACK") k.koTB++;
          if (inp.result === "RETURNED" || inp.result === "TOUCHDOWN") {
            const ret = inp.returnYards || 0;
            const r = row(D, "kickReturns", inp.returner);
            r.no++; r.yds += ret; r.long = longest(r.long, ret);
            if (td) r.td++;
          }
          if (td) openTD = score(tdTeam, 6, q, `${tag(inp.returner)}${inp.returnYards || 0}-yd kickoff return`, p);
          break;
        }
        case "PUNT": {
          const k = row(T, "punting", inp.punter);
          const dist = inp.distance ? inp.distance
            : (inp.result === "TOUCHBACK" ? 100 - (cm.ballOnBefore || 0) : 0);
          k.no++; k.yds += dist; if (dist) k.long = longest(k.long, dist);
          if (inp.result === "RETURNED" || inp.result === "TOUCHDOWN") {
            const ret = inp.returnYards || 0;
            const r = row(D, "puntReturns", inp.returner);
            r.no++; r.yds += ret; r.long = longest(r.long, ret);
            if (td) r.td++;
          }
          if (td) openTD = score(tdTeam, 6, q, `${tag(inp.returner)}${inp.returnYards || 0}-yd punt return`, p);
          break;
        }
        case "FIELD_GOAL": {
          const dist = (100 - cm.ballOnBefore) + 10;
          const k = row(T, "kicking", inp.kicker);
          k.fga++;
          if (inp.result === "GOOD") {
            k.fgm++; k.fgLong = longest(k.fgLong, dist);
            score(off, 3, q, `${tag(inp.kicker)}${dist}-yd field goal`, p);
          }
          openTD = null;
          break;
        }
        case "PENALTY": {
          const P = teams[inp.team];
          if (P && inp.accepted) {
            P.totals.penalties++; P.totals.penYds += Math.abs(inp.yards || 0);
            const cf = inp.confirm;
            if (inp.team === def && cf && cf.down === 1 && cm.phase === "PLAY" &&
                (inp.automaticFirstDown || (cf.ballOn - cm.ballOnBefore) >= cm.toGo)) {
              T.totals.fdPen++;
            }
          }
          break;
        }
        case "TIMEOUT": {
          if (teams[inp.team]) timeouts.push({ quarter: q, team: inp.team, playId: p.id,
                                               clock: inp.clock != null ? inp.clock : null });
          break;
        }
        case "TRY": {
          const good = ev.includes("TRY_GOOD"), defTwo = ev.includes("DEFENSIVE_2PT");
          if (!good && !defTwo && !ev.includes("TRY_NO_GOOD")) break;   // orphaned try: not scored
          let note;
          if (inp.tryType === "KICK") {
            const k = row(T, "kicking", inp.kicker);
            k.pata++; if (good) k.patm++;
            note = good ? `${tag(inp.kicker)}kick` : "kick failed";
          } else {
            T.totals.twoPtAtt++; if (good) T.totals.twoPtMade++;
            if (!good) note = (inp.tryType === "RUN" ? "run" : "pass") + " failed";
            else if (inp.tryType === "RUN") note = `${tag(inp.runner)}run`;
            else note = hasNum(inp.passer) || hasNum(inp.receiver)
              ? `pass${hasNum(inp.passer) ? " #" + inp.passer : ""}${hasNum(inp.receiver) ? " to #" + inp.receiver : ""}`
              : "pass";

          if (openTD) {

            openTD.home = running[H]; openTD.away = running[A];

          openTD = null;

      }
      if (ev.includes("SAFETY")) { score(def, 2, q, "Safety", p); openTD = null; }
    }

    for (const ab of [H, A]) {
      const t = teams[ab].totals;
      t.firstDowns = t.fdRush + t.fdPass + t.fdPen;
      t.totalYds = t.rushYds + t.passYds;
      t.ypp = t.plays ? t.totalYds / t.plays : null;
      TABLES.forEach(k => teams[ab][k] = finalizeTable(teams[ab][k], SORT[k]));
    }

    return { home: H, away: A, teams, line, scoring, timeouts, status: gameStatus(game, state),
             overtime: (state.quarter === "OT" && !isFinal(game)) || (line[H][4] + line[A][4] > 0),
             engineScore: state.score };
  }

  function gameDate(game) {
    if (game.config.date) return game.config.date;
    const first = game.plays.find(p => p.timestamp);

  function isFinal(game, state) {
    const lp = lastPlay(game);

    if (lp.input && lp.input.final) return true;          // ended by choice (tie, called game)
    if (lp.computed.quarter !== 4 && lp.computed.quarter !== "OT") return false;
    const sc = (state || E.reduceGame(game).state).score;
    const [a, b] = Object.values(sc);

  }

      if (isFinal(game, state)) return "Final";
      if (q === 4 || q === "OT") return q === 4 ? "End of regulation" : "End of OT period";
      if (q === 2) return "Halftime";

  }

  /* leaders: numbered players only — the unattributed row never "leads" */
  function leader(team, table) {
    const rows = team[table].filter(r => r.player !== null);
    return rows.length ? rows[0] : null;
  }

  /* "RIV 14-7", "tied 7-7" */
  function scoreLine(home, away, H, A) {
    if (home === away) return `tied ${home}-${away}`;
    return home > away ? `${H} ${home}-${away}` : `${A} ${away}-${home}`;
  }

  /* ---------- plain-text export for texting / pasting ---------- */

    const c = game.config, H = S.home, A = S.away;
    const th = S.teams[H], ta = S.teams[A];
    const out = [];
    const dateStr = ` (${gameDate(game)})`;
    out.push(`${th.name} ${th.totals.points}, ${ta.name} ${ta.totals.points} — ${S.status}${dateStr}`);
    out.push("");

    const cols = S.overtime ? 5 : 4;
    out.push("Score by quarter");
    for (const ab of [H, A])
      out.push(`${ab}  ${S.line[ab].slice(0, cols).join("  ")}  = ${S.teams[ab].totals.points}`);
    out.push("");

    if (S.scoring.length) {
      out.push("Scoring");
      for (const e of S.scoring) {
        const qn = typeof e.quarter === "number" ? "Q" + e.quarter : "OT";
        out.push(`${qn}${e.clock != null ? " " + clockStr(e.clock) : ""} ${e.team} ${e.text}, ${scoreLine(e.home, e.away, H, A)}`);
      }
      out.push("");
    }

    if (S.timeouts.length) {
      out.push("Timeouts");
      for (const ab of [H, A]) {
        const list = S.timeouts.filter(t => t.team === ab)
          .map(t => `${typeof t.quarter === "number" ? "Q" + t.quarter : "OT"}${t.clock != null ? " " + clockStr(t.clock) : ""}`);
        if (list.length) out.push(`${ab}: ${list.join(", ")}`);
      }
      out.push("");
    }

    const a = th.totals, b = ta.totals;
    out.push(`Team stats (${H} / ${A})`);
    out.push(`First downs: ${a.firstDowns} / ${b.firstDowns}`);
    out.push(`Total yards: ${a.totalYds} / ${b.totalYds}`);
    out.push(`Rushing: ${a.rushAtt} for ${a.rushYds} / ${b.rushAtt} for ${b.rushYds}`);
    out.push(`Passing: ${a.passComp}-${a.passAtt}-${a.passInt}, ${a.passYds} yds / ${b.passComp}-${b.passAtt}-${b.passInt}, ${b.passYds} yds`);
    out.push(`Turnovers: ${a.turnovers} / ${b.turnovers}`);
    out.push(`Penalties: ${a.penalties}-${a.penYds} / ${b.penalties}-${b.penYds}`);
    out.push(`3rd down: ${a.thirdConv}-${a.thirdAtt} / ${b.thirdConv}-${b.thirdAtt}`);
    if (a.fourthAtt || b.fourthAtt) out.push(`4th down: ${a.fourthConv}-${a.fourthAtt} / ${b.fourthConv}-${b.fourthAtt}`);

    const who = r => r.player === null ? "no #" : "#" + r.player;
    const tds = n => n ? `, ${n} TD` : "";
    for (const ab of [H, A]) {
      const t = S.teams[ab];
      const lines = [];
      const add = (label, rows, fmt) => { if (rows.length) lines.push(`${label}: ${rows.map(fmt).join("; ")}`); };
      add("Rushing", t.rushing, r => `${who(r)} ${r.att} for ${r.yds}${tds(r.td)}`);
      add("Passing", t.passing, r => `${who(r)} ${r.comp}-${r.att}-${r.int}, ${r.yds} yds${tds(r.td)}`);
      add("Receiving", t.receiving, r => `${who(r)} ${r.rec} for ${r.yds}${tds(r.td)}`);
      add("Kicking", t.kicking.filter(r => r.fga || r.pata), r => {
        const parts = [];
        if (r.fga) parts.push(`FG ${r.fgm}-${r.fga}${r.fgLong ? " (long " + r.fgLong + ")" : ""}`);
        if (r.pata) parts.push(`PAT ${r.patm}-${r.pata}`);
        return `${who(r)} ${parts.join(", ")}`;
      });
      add("Punting", t.punting, r => `${who(r)} ${r.no} for ${r.yds}${r.no ? " (" + (r.yds / r.no).toFixed(1) + " avg)" : ""}`);
      add("Kick returns", t.kickReturns, r => `${who(r)} ${r.no} for ${r.yds}${tds(r.td)}`);
      add("Punt returns", t.puntReturns, r => `${who(r)} ${r.no} for ${r.yds}${tds(r.td)}`);
      add("Defense", t.defense, r => {
        const parts = [];
        if (r.int) parts.push(`${r.int} INT${r.intYds ? " (" + r.intYds + " yds)" : ""}`);
        if (r.fr) parts.push(`${r.fr} fumble rec`);
        if (r.td) parts.push(`${r.td} TD`);
        return `${who(r)} ${parts.join(", ")}`;
      });
      if (lines.length) { out.push(""); out.push(t.name); lines.forEach(l => out.push(l)); }
    }
    return out.join("\n");
  }

  return { aggregate, leader, scoreLine, toText, gameDate, clockStr, isFinal };
})();

<script>
/* ============================================================

const E = FootballEngine;

}
/* School color choices. Stored on the team as a hex value, so older games

const TEAM_COLORS = [
  ["Red","#C8102E"], ["Maroon","#7A0019"], ["Orange","#F47A20"], ["Gold","#FFC72C"],
  ["Green","#00843D"], ["Forest","#154734"], ["Teal","#007A78"],
  ["Lt blue","#6CACE4"], ["Royal","#0050B5"], ["Navy","#0C2340"], ["Purple","#4B2E83"],
  ["Black","#000000"], ["Gray","#8A8D8F"], ["White","#FFFFFF"]
];
const colorPick = { home: null, away: null };   // hex chosen in the open picker
function colorPicker(side, current) {
  const cur = current ? current.toUpperCase() : null;
  colorPick[side] = cur;

  const list = (cur && !known ? [["Current", cur]] : []).concat(TEAM_COLORS);
  return `<div class="swatches" data-side="${side}">${list.map(([name, hex]) =>
    `<button type="button" class="sw ${hex === cur ? "sel" : ""}" data-swatch="${side}:${hex}"

}

  document.querySelectorAll("[data-swatch]").forEach(b => b.onclick = () => {
    const [side, hex] = b.dataset.swatch.split(":");
    colorPick[side] = colorPick[side] === hex ? null : hex;   // tap again to clear
    document.querySelectorAll(`[data-swatch^="${side}:"]`).forEach(x => {

/* ---------- persistence ---------- */
// strip computed snapshots; they're derived on load
function slimGame(g) {
  return { config: g.config, nextId: g.nextId,
    plays: g.plays.map(p => ({ id: p.id, timestamp: p.timestamp, gameClock: p.gameClock,
      type: p.type, input: p.input, anchored: p.anchored, notes: p.notes, editHistory: p.editHistory })) };

}

  try {

    return g;

/* ---------- game clock: scoring plays and timeouts ----------
   Time is typed register-style on the pad: 3, 4, 2 -> 0:03, 0:34, 3:42.

function qlenSecs() {
  const m = /^(\d+):(\d\d)$/.exec((game && game.config.quarterLength) || "12:00");
  return m ? Number(m[1]) * 60 + Number(m[2]) : 720;
}
const clockDigitsToSecs = n => Math.floor(n / 100) * 60 + (n % 100);
const secsToClockDigits = t => Math.floor(t / 60) * 100 + (t % 60);

  const limit = halfOf(quarter) === "OT" ? 1 : 3;
  return Math.max(0, limit - timeoutsUsed(abbr, quarter));
}
function timeoutDots(abbr, quarter) {
  const limit = halfOf(quarter) === "OT" ? 1 : 3;
  const left = timeoutsLeft(abbr, quarter);
  let html = "";
  for (let i = 0; i < limit; i++) html += `<i class="${i < left ? "on" : ""}"></i>`;
  return `<span class="tos" aria-label="${left} timeout${left === 1 ? "" : "s"} left">${html}</span>`;
}

/* does the play in the panel put points on the board? (tries excluded) */
function draftIsScoring() {
  const d = draft;
  if (!d || d.type === "TRY" || d.type === "TIMEOUT") return false;
  if (d.result === "TOUCHDOWN" || d.result === "SAFETY") return true;
  if (d.type === "FG") return d.result === "GOOD";
  if (editingId !== null) {
    const p = game.plays.find(x => x.id === editingId);
    const ev = (p && p.computed && p.computed.events) || [];
    if (ev.includes("TOUCHDOWN") || ev.includes("SAFETY")) return true;
  }

  return Object.keys(ns).some(k => ns[k] !== cur[k]);

/* ---------- draft helpers ---------- */
function newDraft(type, state) {
  const s = state || E.getState(game);
  switch (type) {
    case "RUN":  return { type, yards: null, runner: null, active: "runner" };   // carrier, then result
    case "PASS": return { type, complete: null, yards: null, passer: null, receiver: null, active: null };
    case "KICKOFF": return { type, kickFrom: s.kickDefault, distance: null, returnYards: null,
                             result: "RETURNED", kicker: null, returner: null, active: "distance",
                             freeKick: s.phase === "FREE_KICK" };
    case "PUNT": return { type, distance: null, returnYards: null, result: "RETURNED",
                          punter: null, returner: null, recTeam: null, spotSide: "own", spotYard: null,
                          active: "distance" };
    case "FG":   return { type, result: null, kicker: null, active: "kicker" };
    case "PENALTY": return { type, team: null, yards: null, accepted: true, autoFD: false,
                             player: null, confirmDown: null, confirmToGo: null,
                             confirmSide: "own", confirmYard: null, active: null };   // pad opens only when a box is tapped

                              returnYards: null, thrownBy: null, lostBy: null, recoveredBy: null,
                              active: "spotYard" };
    case "TRY":  return { type, tryType: null, result: null, kicker: null, runner: null,
                          passer: null, receiver: null, active: null };
    case "KNEEL": return { type, player: null, active: "player" };

}

  if (!draft) return false;

}
function draftReadyBase() {
  if (!draft) return false;
  const d = draft;
  switch (d.type) {
    case "RUN":  return d.yards !== null;
    case "PASS":
      if (d.complete === false) return true;
      if (d.complete === true) return d.yards !== null;
      return false;
    case "KICKOFF":
      if (d.result === "TOUCHBACK" || d.result === "TOUCHDOWN") return true;
      return d.distance !== null;
    case "PUNT":
      if (d.result === "TOUCHBACK" || d.result === "TOUCHDOWN") return true;
      if (d.result === "MUFFED") return d.recTeam !== null && d.spotYard !== null;

function preview() {

  render();
}

  draft.complete = v;
  draft.active = v ? "yards" : null;

}

    prefillPenaltyConfirm();
  if (draft.type === "TRY" && field === "tryType") {
    draft.active = value === "KICK" ? "kicker" : value === "RUN" ? "runner" : "passer";
  }

/* fields that take a +/- sign on the pad */
const SIGNED_FIELDS = { yards: true, returnYards: true };
/* after a jersey number, where the pad goes next: two digits jump automatically,

const NEXT_FIELD = { RUN: { runner: "yards" } };
const nextFieldFor = f => draft && NEXT_FIELD[draft.type] && NEXT_FIELD[draft.type][f];

  const f = draft.active;
  if (!f) return;
  if (key === "NEXT") { const nx = nextFieldFor(f); if (nx) draft.active = nx; render(); return; }
  if (key === "C") draft[f] = null;

    draft.clock = cur >= 1000 ? Number(key) : cur * 10 + Number(key);
  }
  else if (key === "+/-") {

/* Prefill the penalty confirm with standard enforcement; user verifies vs refs. */
function prefillPenaltyConfirm() {
  if (editingId !== null) return;   // editing: confirm values come from the record
  const d = draft;
  if (d.team === null || d.yards === null || !d.accepted) return;
  const s = E.getState(game);
  const onDefense = d.team !== s.possession;
  let newBall = onDefense ? s.ballOn + d.yards : s.ballOn - d.yards;
  newBall = Math.max(1, Math.min(99, newBall));
  let down, toGo;
  if (onDefense && d.autoFD) { down = 1; toGo = 10; }
  else if (onDefense) { down = s.down; toGo = Math.max(1, (s.goalToGo ? 100 : s.firstDownAt) - newBall); }
  else { down = s.down; toGo = Math.max(1, (s.goalToGo ? 100 : s.firstDownAt) - newBall); } // replay down
  if (newBall + toGo > 100) toGo = 100 - newBall;
  d.confirmDown = down;
  d.confirmToGo = toGo;
  d.confirmSide = newBall <= 50 ? "own" : "opp";
  d.confirmYard = newBall <= 50 ? newBall : 100 - newBall;
}

function commit() {
  if (!draftReady()) return;
  if (draft.type === "TIMEOUT") {
    const q = E.getState(game).quarter;
    if (timeoutsLeft(draft.team, q) === 0 &&
        !confirm(`${draft.team} has no timeouts left ${halfOf(q) === "OT" ? "this overtime" : "this half"}. Record it anyway?`)) return;
  }
  E.applyPlay(game, engineType(draft.type), draftToInput());
  draft = null;
  save();
  render();
}
/* ---------- Phase 4: screens, play log, corrections ---------- */
let screen = "live";            // live | log | edit | stats
let logReturn = "live";         // where Back from the log goes
let editingId = null;
let editReturn = "live";        // where Back from edit goes
let soonMsg = null;             // transient banner text

function editLast() {
  const last = game.plays[game.plays.length - 1];
  if (last) openEdit(last.id, "live");
}
function undoLast() {
  if (!game.plays.length) return;
  const gone = game.plays[game.plays.length - 1];
  if (!confirm("Undo this play?\n\n" + playSummary(gone, game.config))) return;
  game.plays.pop();
  E.reduceGame(game);
  draft = null;
  save();
  render();
}

function openLog(from) { logReturn = from === "stats" ? "stats" : "live"; screen = "log"; draft = null; render(); }
function closeLog() { screen = logReturn; logReturn = "live"; render(); }
function openEdit(playId, from, focus) {
  const p = game.plays.find(x => x.id === playId);
  if (!p) return;
  editingId = playId;
  editReturn = from || "log";
  draft = draftFromPlay(p);
  if (focus) draft.active = focus;
  screen = "edit";
  render();
}
function closeEdit() {
  editingId = null;
  draft = null;
  screen = editReturn;
  render();
}

/* rebuild a draft from a stored play so the entry panel can edit it */
function posToSide(pos) { return pos <= 50 ? { side:"own", yard:pos } : { side:"opp", yard:100-pos }; }
function draftFromPlay(p) {
  const d = draftFromPlayBase(p);
  d.clock = (p.input && p.input.clock != null) ? secsToClockDigits(p.input.clock) : null;
  if (p.type === "TIMEOUT") d.active = "clock";
  return d;
}
function draftFromPlayBase(p) {
  const inp = p.input, cm = p.computed;
  switch (p.type) {
    case "RUN":  return { type:"RUN", yards: inp.yards ?? null, runner: inp.runner ?? null, active:"runner" };
    case "PASS": return { type:"PASS", complete: !!inp.complete, yards: inp.yards ?? null,
                          passer: inp.passer ?? null, receiver: inp.receiver ?? null, active: inp.complete?"yards":null };
    case "KICKOFF": return { type:"KICKOFF", kickFrom: inp.kickFrom ?? 40, distance: inp.distance ?? null,
                             returnYards: inp.returnYards ?? null, result: inp.result || "RETURNED",
                             kicker: inp.kicker ?? null, returner: inp.returner ?? null, active:"distance",
                             freeKick: cm && cm.phase === "FREE_KICK" };
    case "PUNT": {
      const d = { type:"PUNT", distance: inp.distance ?? null, returnYards: inp.returnYards ?? null,
                  result: inp.result || "RETURNED", punter: inp.punter ?? null, returner: inp.returner ?? null,
                  recTeam: inp.recoveredByTeam ?? null, spotSide:"own", spotYard:null, active:"distance" };
      if (inp.finalSpot != null) { const s = posToSide(inp.finalSpot); d.spotSide = s.side; d.spotYard = s.yard; }
      return d;
    }
    case "FIELD_GOAL": return { type:"FG", result: inp.result || null, kicker: inp.kicker ?? null, active:"kicker" };
    case "PENALTY": {
      const d = { type:"PENALTY", team: inp.team ?? null, yards: inp.yards ?? null,
                  accepted: inp.accepted !== false, autoFD: !!inp.automaticFirstDown,
                  player: inp.player ?? null, confirmDown: null, confirmToGo: null,
                  confirmSide:"own", confirmYard: null, active: null };
      if (inp.confirm) {
        d.confirmDown = inp.confirm.down; d.confirmToGo = inp.confirm.toGo;
        const s = posToSide(inp.confirm.ballOn); d.confirmSide = s.side; d.confirmYard = s.yard;
      }
      return d;
    }
    case "TURNOVER": {
      const d = { type:"TURNOVER", ttype: inp.turnoverType || null, result: inp.result || "RECOVERED",
                  spotSide:"own", spotYard:null, returnYards: inp.returnYards ?? null,
                  thrownBy: inp.thrownBy ?? null, lostBy: inp.lostBy ?? null,
                  recoveredBy: inp.recoveredBy ?? null, active:"spotYard" };
      if (inp.finalSpot != null) { const s = posToSide(inp.finalSpot); d.spotSide = s.side; d.spotYard = s.yard; }
      return d;
    }
    case "TRY":  return { type:"TRY", tryType: inp.tryType || null, result: inp.result || null,
                          kicker: inp.kicker ?? null, runner: inp.runner ?? null,
                          passer: inp.passer ?? null, receiver: inp.receiver ?? null, active:null };
    case "KNEEL": return { type:"KNEEL", player: inp.player ?? null, active:"player" };
    case "TIMEOUT": return { type:"TIMEOUT", team: inp.team ?? null };
    default: return { type: p.type, uneditable: true };
  }
}

/* the state as it stood when this play was snapped (for panel context) */
function pseudoStateFor(p) {
  const cm = p.computed || {};
  return { phase: cm.phase || "PLAY", possession: cm.possession, ballOn: cm.ballOnBefore || 0,
           down: cm.down || 1, goalToGo: false, firstDownAt: 100,
           kickDefault: p.input.kickFrom != null ? p.input.kickFrom : 40,
           score: E.getState(game).score, quarter: cm.quarter };
}

/* Save an edit: preview the cascade; commit silently if nothing else moves. */
function onEditSave() {
  if (!draftReady()) return;
  const p = game.plays.find(x => x.id === editingId);
  const newInput = draftToInput();
  if (p.type === "RUN" || p.type === "PASS" || p.type === "KNEEL") newInput.result = null; // re-derive TD/safety
  const baseConflicts = E.reduceGame(game).conflicts.map(c => c.playId + ":" + c.type);
  const pv = E.previewEdit(game, editingId, newInput);
  const conflicts = pv.conflicts.filter(c =>
    !(c.playId === editingId && (c.type === "TD_NOT_RECORDED" )) &&
    !baseConflicts.includes(c.playId + ":" + c.type));
  const others = pv.changes.filter(ch => ch.playId !== editingId);
  if (!conflicts.length && !others.length) { doCommitEdit(newInput); return; }
  openCascadeSheet(pv, conflicts, others, newInput);
}
function doCommitEdit(newInput) {
  E.commitEdit(game, editingId, newInput);
  const p = game.plays.find(x => x.id === editingId);
  if (p.type === "RUN" || p.type === "PASS" || p.type === "KNEEL") {   // re-freeze derived result
    const ev = (p.computed && p.computed.events) || [];
    if (ev.includes("TOUCHDOWN")) p.input.result = "TOUCHDOWN";
    else if (ev.includes("SAFETY")) p.input.result = "SAFETY";
    else p.input.result = null;
    E.reduceGame(game);
  }
  save();
  closeSheet();
  closeEdit();
}
function openCascadeSheet(pv, conflicts, others, newInput) {
  const c = game.config;
  const conflictHtml = conflicts.map(cf =>
    `<div class="cascade conflict">⚠ Play ${cf.playId}: ${cf.message}</div>`).join("");
  const changeHtml = others.map(ch => {
    const b = E.displayYardLine(ch.before.ballOnAfter, ch.before.possessionAfter, c);
    const a = E.displayYardLine(ch.after.ballOnAfter, ch.after.possessionAfter, c);
    const held = ch.anchorHeld ? ' <span class="held">— confirmed spot holds, cascade stops</span>' : '';
    return `<div class="cascade">Play ${ch.playId}: ${b} → ${a}${held}</div>`;
  }).join("");
  openSheet(`
    <h3>This change recalculates ${others.length} later play${others.length===1?'':'s'}</h3>
    ${conflictHtml}
    ${changeHtml || '<div class="cascade">No downstream position changes.</div>'}
    ${conflicts.length ? '<div class="cascade" style="color:var(--dim);">Conflicts mean a recorded result no longer matches the math — fix the flagged play after confirming, or cancel and re-check this edit.</div>' : ''}
    <button class="sel" id="cascadeGo" style="text-align:center;">Confirm change</button>
    <button class="cancel" id="cascadeNo">Cancel</button>
  `);
  document.getElementById("cascadeGo").onclick = () => doCommitEdit(newInput);
  document.getElementById("cascadeNo").onclick = closeSheet;
}
function onDeletePlay() {
  const p = game.plays.find(x => x.id === editingId);
  if (!p) return;
  const idx = game.plays.indexOf(p);
  const laterCount = game.plays.length - idx - 1;
  const warn = laterCount ? `\n\n${laterCount} later play${laterCount===1?'':'s'} will recalculate (anchors bound the ripple).` : "";
  if (!confirm("Delete this play?\n\n" + playSummary(p, game.config) + warn)) return;
  game.plays.splice(idx, 1);
  E.reduceGame(game);
  save();
  closeEdit();
}

function renderGameOver(state, c) {
  const H = c.homeTeam.abbr, A = c.awayTeam.abbr;
  const homeCol = readable(teamColor("home"), "#3ddc84"), awayCol = readable(teamColor("away"), "#5b9dff");
  const h = state.score[H], a = state.score[A];
  const result = h === a ? "Tie game" : `${esc(h > a ? c.homeTeam.name : c.awayTeam.name)} win`;
  app.innerHTML = `
    <div class="board">
      <div class="team"><span class="abbr" style="color:${homeCol}">${esc(H)}</span><span class="pts">${h}</span></div>
      <div class="meta"><span>Final</span><button class="menubtn" id="menuBtn" aria-label="Menu">⋯</button></div>
      <div class="team"><span class="pts">${a}</span><span class="abbr" style="color:${awayCol}">${esc(A)}</span></div>
    </div>
    <div class="sit"><div class="dd">Final</div><div class="spot">${result}, ${Math.max(h, a)}–${Math.min(h, a)}</div></div>
    <div class="scroll">
      <button class="save" id="goStats"><span>Stats & email box score</span><span class="preview">PDF, text or backup file</span></button>
      <button class="resume" id="goLog">Play log</button>
      <button class="resume" id="reopen">Undo end of game</button>
    </div>
    ${renderLast(c)}`;
  document.getElementById("goStats").onclick = openStats;
  document.getElementById("menuBtn").onclick = openMenu;
  document.getElementById("goLog").onclick = () => openLog("live");
  document.getElementById("reopen").onclick = () => {
    if (!confirm("Reopen the game? This removes the end-of-game entry so you can keep entering plays.")) return;
    game.plays.pop(); E.reduceGame(game); save(); render();
  };
  const lt = document.getElementById("lastTxt"); if (lt) lt.onclick = () => openLog("live");
  const ub = document.getElementById("undoBtn"); if (ub) ub.onclick = undoLast;
  const eb = document.getElementById("editBtn"); if (eb) eb.style.display = "none";
}
function endQuarterLabel(q) {
  return q === 2 ? "End half" : q === 4 ? "End regulation" : q === "OT" ? "End overtime" : "End quarter";
}
function finishQuarter(input) {
  E.endQuarter(game, input);
  draft = null; save(); closeSheet();
  if (FootballStats.aggregate(game).status === "Final") { openStats(); return; }
  render();
}
function endQuarterFlow() {
  const s = E.getState(game), c = game.config;
  if (s.phase === "TRY") {
    alert("Enter the try first. It's still played when time runs out on the touchdown.");
    closeSheet();
    return;
  }
  if (s.quarter === 4 || s.quarter === "OT") {
    const H = c.homeTeam.abbr, A = c.awayTeam.abbr;
    if (s.score[H] !== s.score[A]) { finishQuarter({}); return; }     // someone's ahead: Final
    const when = s.quarter === 4 ? "after regulation" : "after this overtime";
    openSheet(`
      <h3>Tied ${s.score[H]}–${s.score[A]} ${when}</h3>
      <button class="sel" id="otGo" style="text-align:center;">${s.quarter === 4 ? "Start overtime" : "Another overtime"}</button>
      <button id="otTie" style="text-align:center;">End game as a tie</button>
      <button class="cancel" id="otCancel">Cancel</button>
    `);
    document.getElementById("otGo").onclick = () => { finishQuarter({}); openSetSpot(); };
    document.getElementById("otTie").onclick = () => finishQuarter({ final: true });
    document.getElementById("otCancel").onclick = closeSheet;
    return;
  }
  if (s.quarter !== 2) { finishQuarter({}); return; }
  // Halftime: whoever received the opening kickoff kicks to start the second half.
  const H = c.homeTeam.abbr, A = c.awayTeam.abbr;
  const usual = E.otherTeam(c.whoKicksOff, c);
  const btn = ab => `<button class="${ab === usual ? "sel" : ""}" data-htkick="${esc(ab)}" style="text-align:center;">
      ${esc(ab === H ? c.homeTeam.name : c.awayTeam.name)} kicks off${ab === usual ? " (usual)" : ""}</button>`;
  openSheet(`
    <h3>Halftime</h3>
    <div class="cascade" style="border:none;color:var(--dim);">Who kicks off to start the second half?</div>
    ${btn(usual)}${btn(E.otherTeam(usual, c))}
    <button class="cancel" id="htCancel">Cancel</button>
  `);
  document.querySelectorAll("[data-htkick]").forEach(b =>
    b.onclick = () => finishQuarter({ halftimeKicker: b.dataset.htkick }));
  document.getElementById("htCancel").onclick = closeSheet;
}

  localStorage.removeItem(STORE_KEY);
  game = null; draft = null;
